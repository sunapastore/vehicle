<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>निवेदन फाराम · प्रविष्टि</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Nirmala UI', sans-serif;
        }

        body {
            background: #f0f4f8;
            padding: 1.5rem;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            background: #fff;
            border-radius: 28px;
            box-shadow: 0 20px 40px -10px rgba(0, 20, 30, 0.2);
            padding: 2rem 2.2rem;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            border-bottom: 3px solid #d0e2f0;
            padding-bottom: 0.8rem;
            margin-bottom: 1.5rem;
        }

        .top-bar h1 {
            font-size: 1.6rem;
            color: #0b2b3d;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .top-bar h1 i {
            color: #1a6f8f;
        }

        .back-btn {
            text-decoration: none;
            background: #e3ecf3;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            color: #1f4960;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .back-btn:hover {
            background: #d0dce6;
        }

        .form-section {
            background: #f8fafc;
            padding: 1.5rem;
            border-radius: 16px;
            margin-bottom: 1.5rem;
        }

        .form-section h3 {
            margin-bottom: 1rem;
            color: #0b2b3d;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem 1.5rem;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #1e4057;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        label i {
            color: #3a7b97;
            width: 1rem;
        }

        .required {
            color: #dc3545;
            font-weight: 700;
        }

        input,
        select,
        textarea {
            padding: 0.6rem 0.9rem;
            border: 1px solid #dbe4eb;
            border-radius: 12px;
            font-size: 0.92rem;
            background: #fbfdff;
            transition: 0.2s;
            width: 100%;
            outline: none;
            color: #0b2b3d;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2b7fa0;
            box-shadow: 0 0 0 3px rgba(35, 120, 160, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 70px;
        }

        .readonly-input {
            background: #eef4f9;
            color: #1f4a61;
            font-weight: 500;
            border-color: #cbdbe7;
        }

        .btn-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: flex-end;
            gap: 0.8rem;
            margin-top: 1.8rem;
            padding-top: 1.5rem;
            border-top: 2px dashed #dce8f0;
        }

        .btn {
            border: none;
            padding: 0.7rem 2rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.15s;
        }

        .btn-primary {
            background: #1b6a89;
            color: #fff;
            box-shadow: 0 4px 12px rgba(22, 90, 120, 0.25);
        }

        .btn-primary:hover {
            background: #0f5773;
        }

        .btn-success {
            background: #1d8a5f;
            color: #fff;
            box-shadow: 0 4px 12px rgba(25, 110, 70, 0.25);
        }

        .btn-success:hover {
            background: #13724b;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #b2ccdb;
            color: #1f4960;
        }

        .btn-outline:hover {
            background: #e2edf5;
        }

        .btn-danger {
            background: #dc3545;
            color: #fff;
        }

        .btn-danger:hover {
            background: #b02a37;
        }

        .btn-warning {
            background: #ffc107;
            color: #1f4960;
        }

        .btn-warning:hover {
            background: #e0a800;
        }

        .table-wrap {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #e8f0f5;
            margin-top: 1.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
            min-width: 700px;
        }

        th {
            background: #eef5fa;
            color: #1e4057;
            padding: 0.6rem 0.6rem;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #d0e2f0;
            white-space: nowrap;
        }

        td {
            padding: 0.4rem 0.6rem;
            border-bottom: 1px solid #e8f0f5;
            vertical-align: middle;
        }

        tr:hover {
            background: #f8fafc;
        }

        .action-btns {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .action-btns button {
            border: none;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.2s;
        }

        .action-btns .edit {
            background: #d9e9f2;
            color: #004466;
        }
        .action-btns .edit:hover {
            background: #b5d4e3;
        }

        .action-btns .print-btn {
            background: #d4edda;
            color: #155724;
        }
        .action-btns .print-btn:hover {
            background: #b7dfc6;
        }

        .action-btns .delete {
            background: #f8d7da;
            color: #721c24;
        }
        .action-btns .delete:hover {
            background: #f5c6cb;
        }

        .search-box {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .search-box input {
            padding: 0.5rem 1rem;
            border: 1px solid #dbe4eb;
            border-radius: 10px;
            font-size: 0.9rem;
            flex: 1;
            min-width: 200px;
            outline: none;
        }

        .search-box input:focus {
            border-color: #2b7fa0;
            box-shadow: 0 0 0 3px rgba(35, 120, 160, 0.15);
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: #0d3144;
            color: #fff;
            padding: 0.7rem 2rem;
            border-radius: 60px;
            font-weight: 500;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
            z-index: 999;
            opacity: 0;
            transition: 0.25s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }
        .toast.success {
            background: #1b7a56;
        }
        .toast.error {
            background: #a13d3d;
        }
        .toast.info {
            background: #0d6efd;
        }

        .status-badge {
            background: #d9e9f2;
            padding: 0.3rem 1.2rem;
            border-radius: 30px;
            font-size: 0.8rem;
            color: #004466;
            font-weight: 500;
        }

        .note {
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #3a637b;
            background: #eaf2f9;
            padding: 0.6rem 1.2rem;
            border-radius: 40px;
            display: inline-block;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .container {
                padding: 1rem;
            }
            .top-bar {
                flex-direction: column;
                align-items: flex-start;
            }
            .btn-row {
                flex-direction: column;
                align-items: stretch;
            }
            .btn {
                justify-content: center;
            }
            .search-box {
                flex-direction: column;
            }
            .search-box input {
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <h1><i class="fas fa-file-alt"></i> निवेदन फाराम</h1>
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> ड्यासबोर्ड</a>
        </div>

        <!-- Add/Edit Form -->
        <div class="form-section">
            <h3 id="formTitle"><i class="fas fa-plus-circle"></i> नयाँ पत्र थप्नुहोस्</h3>
            <form id="letterForm" novalidate>
                <input type="hidden" id="editId" name="ID">
                <div class="form-grid">
                    <!-- Application No (Auto) -->
                    <div class="field-group">
                        <label><i class="fas fa-hashtag"></i> निवेदन नं.</label>
                        <input type="text" id="appNo" name="Application_No" class="readonly-input" readonly>
                    </div>

                    <!-- Letter Date -->
                    <div class="field-group">
                        <label><i class="fas fa-calendar-alt"></i> मिति <span class="required">*</span></label>
                        <input type="text" id="letterDate" name="Letter_Date" placeholder="२०८१-०३-१५" maxlength="10" required>
                    </div>

                    <!-- Vehicle No -->
                    <div class="field-group">
                        <label><i class="fas fa-truck"></i> सवारी नं. <span class="required">*</span></label>
                        <select id="vehicleNo" name="Vehicle_No" required>
                            <option value="">लोड हुँदै...</option>
                        </select>
                    </div>

                    <!-- Item Name (Auto-filled from Vehicle selection) -->
                    <div class="field-group">
                        <label><i class="fas fa-box"></i> सामान</label>
                        <input type="text" id="itemName" name="Item_Name" placeholder="सवारी साधन" readonly>
                    </div>

                    <!-- Repair Reason (Full Width) -->
                    <div class="field-group full-width">
                        <label><i class="fas fa-exclamation-triangle"></i> मर्मत गर्नुपर्ने कारण <span class="required">*</span></label>
                        <textarea id="repairReason" name="Repair_Reason" rows="4" placeholder="मर्मत गर्नुपर्ने कारणहरू लेख्नुहोस्..." required></textarea>
                    </div>

                    <!-- Applicant Name (Dropdown from Drivers) -->
                    <div class="field-group">
                        <label><i class="fas fa-user"></i> निवेदकको नाम <span class="required">*</span></label>
                        <select id="applicantName" name="Applicant_Name" required>
                            <option value="">लोड हुँदै...</option>
                        </select>
                    </div>

                    <!-- Applicant Position (Dropdown from Drivers) -->
                    <div class="field-group">
                        <label><i class="fas fa-user-tie"></i> पद</label>
                        <select id="applicantPosition" name="Applicant_Position">
                            <option value="">लोड हुँदै...</option>
                        </select>
                    </div>
                </div>

                <div class="btn-row">
                    <span class="status-badge"><i class="fas fa-save"></i> सुरक्षित</span>
                    <button type="button" class="btn btn-danger" id="resetBtn"><i class="fas fa-undo-alt"></i> खाली</button>
                    <button type="button" class="btn btn-warning" id="editFormBtn" style="display:none;"><i class="fas fa-edit"></i> सम्पादन</button>
                    <button type="submit" class="btn btn-primary" id="saveBtn"><i class="fas fa-save"></i> सुरक्षित</button>
                    <button type="button" class="btn btn-outline" id="cancelEditBtn" style="display:none;"><i class="fas fa-times"></i> रद्द</button>
                </div>
            </form>
        </div>

        <!-- Search & Table -->
        <div class="search-box">
            <input type="text" id="searchLetter" placeholder="🔍 पत्र खोज्नुहोस् (निवेदन नं., सवारी नं., निवेदक)...">
            <button class="btn btn-primary" id="searchBtn" style="padding:0.5rem 1.2rem;"><i class="fas fa-search"></i> खोज</button>
            <button class="btn btn-outline" id="refreshBtn" style="padding:0.5rem 1.2rem;"><i class="fas fa-sync"></i> रिफ्रेस</button>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>क्र.सं.</th>
                        <th>निवेदन नं.</th>
                        <th>मिति</th>
                        <th>सवारी नं.</th>
                        <th>निवेदक</th>
                        <th style="text-align:center;">कार्य</th>
                    </tr>
                </thead>
                <tbody id="letterTableBody">
                    <tr>
                        <td colspan="6" style="text-align:center;padding:2rem;color:#5d7f92;">
                            <i class="fas fa-spinner fa-pulse"></i> लोड हुँदै...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // ============================================================
        // CONFIGURATION
        // ============================================================
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxlPhy_16N--T89myiSGwWlwXeC8Qrh8-5xRf6z7Gua8ATFtPMUpqlmHj7jCkKhi_6A/exec";

        let letterData = [];
        let vehicleData = [];
        let driverData = [];
        let isEditing = false;

        const toast = document.getElementById('toast');

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(msg, type = 'success') {
            toast.textContent = msg;
            toast.className = 'toast show ' + type;
            clearTimeout(toast._hideTimer);
            toast._hideTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        // ============================================================
        // FETCH AUTO APPLICATION NUMBER
        // ============================================================
        function fetchApplicationNo() {
            fetch(`${SCRIPT_URL}?action=applicationNo`)
                .then(r => r.json())
                .then(d => {
                    document.getElementById('appNo').value = d.applicationNo ||
                        'MR-' + new Date().getFullYear() + '-' + String(Math.floor(Math.random() * 9999)).padStart(4, '0');
                })
                .catch(() => {
                    document.getElementById('appNo').value = 'MR-' + new Date().getFullYear() + '-' +
                        String(Math.floor(Math.random() * 9999)).padStart(4, '0');
                });
        }

        // ============================================================
        // LOAD VEHICLES
        // ============================================================
        function loadVehicles() {
            const select = document.getElementById('vehicleNo');
            select.innerHTML = '<option value="">लोड हुँदै...</option>';

            fetch(`${SCRIPT_URL}?action=vehicles`)
                .then(r => r.json())
                .then(data => {
                    vehicleData = Array.isArray(data) ? data : [];
                    select.innerHTML = '<option value="">छान्नुहोस्</option>';
                    if (vehicleData.length === 0) {
                        select.innerHTML = '<option value="">कुनै सवारी छैन</option>';
                        return;
                    }
                    vehicleData.forEach(row => {
                        const val = row.Vehicle_No || '';
                        if (val) {
                            const label = val + (row.Vehicle_Type ? ' (' + row.Vehicle_Type + ')' : '');
                            select.innerHTML += `<option value="${val}" data-item="${row.Vehicle_Type || ''}">${label}</option>`;
                        }
                    });
                })
                .catch(() => {
                    select.innerHTML = '<option value="">त्रुटि</option>';
                });
        }

        // ============================================================
        // LOAD DRIVERS - For Applicant Name and Position dropdowns
        // ============================================================
        function loadDrivers() {
            const nameSelect = document.getElementById('applicantName');
            const positionSelect = document.getElementById('applicantPosition');
            
            nameSelect.innerHTML = '<option value="">लोड हुँदै...</option>';
            positionSelect.innerHTML = '<option value="">लोड हुँदै...</option>';

            fetch(`${SCRIPT_URL}?action=drivers`)
                .then(r => r.json())
                .then(data => {
                    driverData = Array.isArray(data) ? data : [];
                    
                    // Populate Applicant Name dropdown
                    nameSelect.innerHTML = '<option value="">छान्नुहोस्</option>';
                    if (driverData.length === 0) {
                        nameSelect.innerHTML = '<option value="">कुनै चालक छैन</option>';
                    } else {
                        driverData.forEach(row => {
                            const name = row.Driver_Name || '';
                            if (name) {
                                nameSelect.innerHTML += `<option value="${name}" data-position="${row.Designation || row.Post || ''}">${name}</option>`;
                            }
                        });
                    }

                    // Populate Position dropdown (with all unique positions)
                    positionSelect.innerHTML = '<option value="">छान्नुहोस्</option>';
                    const positions = new Set();
                    driverData.forEach(row => {
                        const pos = row.Designation || row.Post || '';
                        if (pos) positions.add(pos);
                    });
                    positions.forEach(pos => {
                        positionSelect.innerHTML += `<option value="${pos}">${pos}</option>`;
                    });
                    
                    if (positions.size === 0) {
                        positionSelect.innerHTML = '<option value="">कुनै पद छैन</option>';
                    }
                })
                .catch(() => {
                    nameSelect.innerHTML = '<option value="">त्रुटि</option>';
                    positionSelect.innerHTML = '<option value="">त्रुटि</option>';
                });
        }

        // ============================================================
        // AUTO-FILL ITEM NAME WHEN VEHICLE SELECTED
        // ============================================================
        document.getElementById('vehicleNo').addEventListener('change', function() {
            const selected = this.options[this.selectedIndex];
            const itemName = selected.getAttribute('data-item') || '';
            document.getElementById('itemName').value = itemName;
        });

        // ============================================================
        // AUTO-FILL POSITION WHEN APPLICANT SELECTED
        // ============================================================
        document.getElementById('applicantName').addEventListener('change', function() {
            const selected = this.options[this.selectedIndex];
            const position = selected.getAttribute('data-position') || '';
            if (position) {
                document.getElementById('applicantPosition').value = position;
            }
        });

        // ============================================================
        // LOAD LETTERS LIST
        // ============================================================
        function loadLetters() {
            const tbody = document.getElementById('letterTableBody');
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:2rem;color:#5d7f92;">
                <i class="fas fa-spinner fa-pulse"></i> लोड हुँदै...</td></tr>`;

            fetch(`${SCRIPT_URL}?action=letters`)
                .then(r => r.json())
                .then(data => {
                    letterData = Array.isArray(data) ? data : [];
                    renderLetters();
                })
                .catch(err => {
                    console.error('Load error:', err);
                    tbody.innerHTML =
                        `<tr><td colspan="6" style="text-align:center;padding:2rem;color:#a13d3d;">
                        <i class="fas fa-exclamation-circle"></i> लोड गर्न असफल</td></tr>`;
                });
        }

        // ============================================================
        // RENDER LETTERS
        // ============================================================
        function renderLetters() {
            const search = document.getElementById('searchLetter').value.toLowerCase();
            const filtered = letterData.filter(row => {
                const searchText = (row.Application_No || '') + ' ' + (row.Vehicle_No || '') + ' ' + (row.Applicant_Name || '');
                return searchText.toLowerCase().includes(search);
            });

            const tbody = document.getElementById('letterTableBody');

            if (filtered.length === 0) {
                tbody.innerHTML =
                    `<tr><td colspan="6" style="text-align:center;padding:2rem;color:#5d7f92;">कुनै पत्र छैन</td></tr>`;
                return;
            }

            let html = '';
            filtered.forEach((row, idx) => {
                html += `
                    <tr>
                        <td>${idx + 1}</td>
                        <td><strong>${row.Application_No || '-'}</strong></td>
                        <td>${row.Letter_Date || '-'}</td>
                        <td>${row.Vehicle_No || '-'}</td>
                        <td>${row.Applicant_Name || '-'}</td>
                        <td>
                            <div class="action-btns">
                                <button class="edit" onclick="editLetter('${row.ID}')"><i class="fas fa-edit"></i></button>
                                <button class="print-btn" onclick="printLetter('${row.ID}')"><i class="fas fa-print"></i></button>
                                <button class="delete" onclick="deleteLetter('${row.ID}')"><i class="fas fa-trash"></i></button>
                            </div>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        // ============================================================
        // SAVE LETTER DATA - Handles both Create and Update
        // ============================================================
        document.getElementById('letterForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const date = document.getElementById('letterDate').value;
            const vehicle = document.getElementById('vehicleNo').value;
            const reason = document.getElementById('repairReason').value;
            const applicant = document.getElementById('applicantName').value;

            if (!date) { showToast('❌ कृपया मिति भर्नुहोस्', 'error');
                document.getElementById('letterDate').focus(); return; }
            if (!vehicle) { showToast('❌ कृपया सवारी नं. छान्नुहोस्', 'error');
                document.getElementById('vehicleNo').focus(); return; }
            if (!reason) { showToast('❌ कृपया मर्मत कारण भर्नुहोस्', 'error');
                document.getElementById('repairReason').focus(); return; }
            if (!applicant) { showToast('❌ कृपया निवेदकको नाम छान्नुहोस्', 'error');
                document.getElementById('applicantName').focus(); return; }

            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> पठाउँदै...';

            // Get form data as URLSearchParams
            const formData = new FormData(this);
            const params = new URLSearchParams();
            
            for (const [key, value] of formData.entries()) {
                params.append(key, value);
            }
            
            params.append('sheetName', 'Letters');
            
            const editId = document.getElementById('editId').value;
            const isUpdate = editId && editId !== '';
            
            if (isUpdate) {
                params.append('_method', 'PUT');
                params.append('ID', editId);
            }

            fetch(SCRIPT_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: params.toString()
            })
            .then(r => r.json())
            .then(d => {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save"></i> सुरक्षित';
                
                if (d.result === 'success') {
                    showToast(isUpdate ? '✅ पत्र अद्यावधिक गरियो' : '✅ पत्र थपियो', 'success');
                    document.getElementById('letterForm').reset();
                    document.getElementById('editId').value = '';
                    document.getElementById('editFormBtn').style.display = 'none';
                    document.getElementById('cancelEditBtn').style.display = 'none';
                    document.getElementById('formTitle').innerHTML = '<i class="fas fa-plus-circle"></i> नयाँ पत्र थप्नुहोस्';
                    isEditing = false;
                    loadLetters();
                    fetchApplicationNo();
                    // NO AUTO-PRINT - Only save data
                } else {
                    showToast('❌ ' + (d.error || 'असफल'), 'error');
                }
            })
            .catch(err => {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save"></i> सुरक्षित';
                showToast('⚠️ सर्भर समस्या', 'error');
                console.error(err);
            });
        });

        // ============================================================
        // EDIT LETTER - Load data into form using ID
        // ============================================================
        function editLetter(id) {
            const row = letterData.find(r => String(r.ID) === String(id));
            if (!row) { 
                showToast('पत्र फेला परेन (ID: ' + id + ')', 'error'); 
                return; 
            }

            isEditing = true;
            document.getElementById('editId').value = row.ID;
            document.getElementById('appNo').value = row.Application_No || '';
            document.getElementById('letterDate').value = row.Letter_Date || '';
            document.getElementById('vehicleNo').value = row.Vehicle_No || '';
            document.getElementById('itemName').value = row.Item_Name || '';
            document.getElementById('repairReason').value = row.Repair_Reason || '';
            document.getElementById('applicantName').value = row.Applicant_Name || '';
            document.getElementById('applicantPosition').value = row.Applicant_Position || '';

            document.getElementById('formTitle').innerHTML = '<i class="fas fa-edit"></i> पत्र सम्पादन गर्नुहोस्';
            document.getElementById('editFormBtn').style.display = 'inline-flex';
            document.getElementById('cancelEditBtn').style.display = 'inline-flex';
            document.getElementById('letterDate').focus();

            // Scroll to form
            document.querySelector('.form-section').scrollIntoView({ behavior: 'smooth' });
        }

        // ============================================================
        // EDIT FORM BUTTON - Saves the edited data
        // ============================================================
        document.getElementById('editFormBtn').addEventListener('click', function() {
            document.getElementById('letterForm').dispatchEvent(new Event('submit'));
        });

        // ============================================================
        // DELETE LETTER using ID
        // ============================================================
        function deleteLetter(id) {
            if (!confirm('के यो पत्र मेटाउने?')) return;

            const params = new URLSearchParams();
            params.append('sheetName', 'Letters');
            params.append('ID', id);
            params.append('_method', 'DELETE');

            fetch(SCRIPT_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: params.toString()
            })
            .then(r => r.json())
            .then(d => {
                if (d.result === 'success') {
                    showToast('✅ पत्र मेटियो', 'success');
                    loadLetters();
                } else {
                    showToast('❌ ' + (d.error || 'मेटाउन असफल'), 'error');
                }
            })
            .catch(err => {
                showToast('⚠️ सर्भर समस्या', 'error');
                console.error(err);
            });
        }

        // ============================================================
        // PRINT LETTER FROM LIST using ID
        // ============================================================
        function printLetter(id) {
            if (!id) {
                showToast('❌ ID छैन', 'error');
                return;
            }

            const row = letterData.find(r => String(r.ID) === String(id));
            if (!row) {
                showToast('❌ पत्र फेला परेन (ID: ' + id + ')', 'error');
                return;
            }

            const data = {
                ID: row.ID || '',
                Application_No: row.Application_No || '',
                Letter_Date: row.Letter_Date || '',
                Vehicle_No: row.Vehicle_No || '',
                Item_Name: row.Item_Name || '',
                Repair_Reason: row.Repair_Reason || '',
                Applicant_Name: row.Applicant_Name || '',
                Applicant_Position: row.Applicant_Position || ''
            };

            openPrintPreview(data);
        }

        // ============================================================
        // OPEN PRINT PREVIEW - Links to application-print.html
        // ============================================================
        function openPrintPreview(data) {
            // Store data in sessionStorage for print page
            try {
                sessionStorage.setItem('letterPrintData', JSON.stringify(data));
            } catch (e) {
                // Fallback: use URL params
                const params = new URLSearchParams();
                Object.keys(data).forEach(key => params.append(key, data[key]));
                window.open(`application-print.html?${params.toString()}`, '_blank');
                return;
            }
            window.open('application-print.html', '_blank');
        }

        // ============================================================
        // RESET BUTTON
        // ============================================================
        document.getElementById('resetBtn').addEventListener('click', function() {
            if (isEditing) {
                if (!confirm('के तपाईं सम्पादन रद्द गरी फारम खाली गर्न चाहनुहुन्छ?')) return;
            }
            document.getElementById('letterForm').reset();
            document.getElementById('editId').value = '';
            document.getElementById('editFormBtn').style.display = 'none';
            document.getElementById('cancelEditBtn').style.display = 'none';
            document.getElementById('formTitle').innerHTML = '<i class="fas fa-plus-circle"></i> नयाँ पत्र थप्नुहोस्';
            isEditing = false;
            fetchApplicationNo();
            showToast('फारम खाली गरियो', 'info');
        });

        // ============================================================
        // CANCEL EDIT BUTTON
        // ============================================================
        document.getElementById('cancelEditBtn').addEventListener('click', function() {
            document.getElementById('letterForm').reset();
            document.getElementById('editId').value = '';
            this.style.display = 'none';
            document.getElementById('editFormBtn').style.display = 'none';
            document.getElementById('formTitle').innerHTML = '<i class="fas fa-plus-circle"></i> नयाँ पत्र थप्नुहोस्';
            isEditing = false;
            fetchApplicationNo();
            showToast('सम्पादन रद्द गरियो', 'info');
        });

        // ============================================================
        // DATE FORMAT
        // ============================================================
        document.getElementById('letterDate').addEventListener('input', function(e) {
            let v = e.target.value.replace(/\D/g, '');
            if (v.length >= 4) v = v.slice(0, 4) + '-' + v.slice(4);
            if (v.length >= 7) v = v.slice(0, 7) + '-' + v.slice(7, 9);
            e.target.value = v;
        });

        // ============================================================
        // SEARCH & REFRESH
        // ============================================================
        document.getElementById('searchBtn').addEventListener('click', renderLetters);
        document.getElementById('refreshBtn').addEventListener('click', loadLetters);
        document.getElementById('searchLetter').addEventListener('keyup', function(e) {
            if (e.key === 'Enter') renderLetters();
        });

        // ============================================================
        // INIT
        // ============================================================
        fetchApplicationNo();
        loadVehicles();
        loadDrivers();
        loadLetters();

        window.addEventListener('load', function() {
            const now = new Date();
            const year = now.getFullYear() + 57;
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const el = document.getElementById('letterDate');
            if (!el.value) {
                el.value = year + '-' + month + '-' + day;
            }
        });
    </script>
</body>
</html>
