<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>कोटेशन पत्र · प्रविष्टि</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Nirmala UI', sans-serif;
        }

        body {
            background: #f0f4f8;
            padding: 1.5rem;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            background: #fff;
            border-radius: 28px;
            box-shadow: 0 20px 40px -10px rgba(0, 20, 30, 0.2);
            padding: 2rem 2.2rem;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            border-bottom: 3px solid #d0e2f0;
            padding-bottom: 0.8rem;
            margin-bottom: 1.5rem;
        }

        .top-bar h1 {
            font-size: 1.6rem;
            color: #0b2b3d;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .top-bar h1 i {
            color: #1a6f8f;
        }

        .back-btn {
            text-decoration: none;
            background: #e3ecf3;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            color: #1f4960;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .back-btn:hover {
            background: #d0dce6;
        }

        .form-section {
            background: #f8fafc;
            padding: 1.5rem;
            border-radius: 16px;
            margin-bottom: 1.5rem;
        }

        .form-section h3 {
            margin-bottom: 1rem;
            color: #0b2b3d;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem 1.2rem;
        }

        .form-grid .full-width {
            grid-column: 1 / -1;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .field-group label {
            font-weight: 600;
            font-size: 0.8rem;
            color: #1e4057;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .field-group label i {
            color: #3a7b97;
            width: 1rem;
        }

        .field-group input,
        .field-group select,
        .field-group textarea {
            padding: 0.5rem 0.8rem;
            border: 1px solid #dbe4eb;
            border-radius: 10px;
            font-size: 0.9rem;
            background: #fff;
            outline: none;
            width: 100%;
        }

        .field-group input:focus,
        .field-group select:focus,
        .field-group textarea:focus {
            border-color: #2b7fa0;
            box-shadow: 0 0 0 3px rgba(35, 120, 160, 0.15);
        }

        .field-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        .field-group .readonly-input {
            background: #eef4f9;
            color: #1f4a61;
            font-weight: 500;
        }

        .btn-row {
            display: flex;
            gap: 0.8rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            padding: 0.5rem 1.8rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-primary {
            background: #1b6a89;
            color: #fff;
        }
        .btn-primary:hover {
            background: #0f5773;
        }
        .btn-success {
            background: #1d8a5f;
            color: #fff;
        }
        .btn-success:hover {
            background: #13724b;
        }
        .btn-danger {
            background: #dc3545;
            color: #fff;
        }
        .btn-danger:hover {
            background: #b02a37;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #b2ccdb;
            color: #1f4960;
        }
        .btn-outline:hover {
            background: #e2edf5;
        }
        .btn-warning {
            background: #ffc107;
            color: #1f4960;
        }
        .btn-warning:hover {
            background: #e0a800;
        }

        .table-wrap {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #e8f0f5;
            margin-top: 1.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
            min-width: 700px;
        }

        th {
            background: #eef5fa;
            color: #1e4057;
            padding: 0.6rem 0.6rem;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #d0e2f0;
            white-space: nowrap;
        }

        td {
            padding: 0.4rem 0.6rem;
            border-bottom: 1px solid #e8f0f5;
            vertical-align: middle;
        }

        tr:hover {
            background: #f8fafc;
        }

        .action-btns {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .action-btns button {
            border: none;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.2s;
        }

        .action-btns .edit {
            background: #d9e9f2;
            color: #004466;
        }
        .action-btns .edit:hover {
            background: #b5d4e3;
        }

        .action-btns .print-btn {
            background: #d4edda;
            color: #155724;
        }
        .action-btns .print-btn:hover {
            background: #b7dfc6;
        }

        .action-btns .delete {
            background: #f8d7da;
            color: #721c24;
        }
        .action-btns .delete:hover {
            background: #f5c6cb;
        }

        .search-box {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .search-box input {
            padding: 0.5rem 1rem;
            border: 1px solid #dbe4eb;
            border-radius: 10px;
            font-size: 0.9rem;
            flex: 1;
            min-width: 200px;
            outline: none;
        }

        .search-box input:focus {
            border-color: #2b7fa0;
            box-shadow: 0 0 0 3px rgba(35, 120, 160, 0.15);
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: #0d3144;
            color: #fff;
            padding: 0.7rem 2rem;
            border-radius: 60px;
            font-weight: 500;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
            z-index: 999;
            opacity: 0;
            transition: 0.25s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }
        .toast.success {
            background: #1b7a56;
        }
        .toast.error {
            background: #a13d3d;
        }
        .toast.info {
            background: #0d6efd;
        }

        .note {
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #3a637b;
            background: #eaf2f9;
            padding: 0.6rem 1.2rem;
            border-radius: 40px;
            display: inline-block;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .container {
                padding: 1rem;
            }
            .top-bar {
                flex-direction: column;
                align-items: flex-start;
            }
            .btn-row {
                flex-direction: column;
                align-items: stretch;
            }
            .btn {
                justify-content: center;
            }
            .search-box {
                flex-direction: column;
            }
            .search-box input {
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <h1><i class="fas fa-file-signature"></i> कोटेशन पत्र</h1>
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> ड्यासबोर्ड</a>
        </div>

        <!-- Add/Edit Form -->
        <div class="form-section">
            <h3 id="formTitle"><i class="fas fa-plus-circle"></i> नयाँ पत्र थप्नुहोस्</h3>
            <form id="firmLetterForm" novalidate>
                <input type="hidden" id="editId" name="ID">
                <div class="form-grid">
                    <!-- Application No (Dropdown from Letters sheet) -->
                    <div class="field-group">
                        <label><i class="fas fa-hashtag"></i> निवेदन नं. <span style="color:red;">*</span></label>
                        <select id="applicationNo" name="Application_No" required>
                            <option value="">लोड हुँदै...</option>
                        </select>
                    </div>

                    <!-- Letter No (Auto) -->
                    <div class="field-group">
                        <label><i class="fas fa-hashtag"></i> पत्र नं.</label>
                        <input type="text" id="letterNo" name="Letter_No" class="readonly-input" readonly>
                    </div>

                    <!-- Letter Date -->
                    <div class="field-group">
                        <label><i class="fas fa-calendar-alt"></i> मिति <span style="color:red;">*</span></label>
                        <input type="text" id="letterDate" name="Letter_Date" placeholder="२०८१-०३-१५" maxlength="10" required>
                    </div>

                    <!-- Firm Name (Manually selected) -->
                    <div class="field-group">
                        <label><i class="fas fa-building"></i> फर्मको नाम <span style="color:red;">*</span></label>
                        <select id="firmName" name="Firm_Name" required>
                            <option value="">लोड हुँदै...</option>
                        </select>
                    </div>

                    <!-- Firm Address (Auto-filled from Firm selection) -->
                    <div class="field-group">
                        <label><i class="fas fa-map-pin"></i> फर्मको ठेगाना</label>
                        <input type="text" id="firmAddress" name="Firm_Address" placeholder="ठेगाना" readonly>
                    </div>

                    <!-- Vehicle No (Auto-filled from Application No) -->
                    <div class="field-group">
                        <label><i class="fas fa-truck"></i> सवारी नं. <span style="color:red;">*</span></label>
                        <input type="text" id="vehicleNo" name="Vehicle_No" class="readonly-input" readonly>
                    </div>

                    <!-- Repair Details (Auto-filled from Application No) -->
                    <div class="field-group full-width">
                        <label><i class="fas fa-tools"></i> मर्मत विवरण <span style="color:red;">*</span></label>
                        <textarea id="repairDetails" name="Repair_Details" rows="3" class="readonly-input" readonly></textarea>
                    </div>
                </div>

                <div class="btn-row">
                    <button type="submit" class="btn btn-primary" id="submitBtn"><i class="fas fa-save"></i> सुरक्षित</button>
                    <button type="button" class="btn btn-warning" id="editFormBtn" style="display:none;"><i class="fas fa-edit"></i> सम्पादन</button>
                    <button type="button" class="btn btn-outline" id="resetBtn"><i class="fas fa-undo-alt"></i> खाली</button>
                    <button type="button" class="btn btn-outline" id="cancelEditBtn" style="display:none;"><i class="fas fa-times"></i> रद्द</button>
                </div>
            </form>
        </div>

        <!-- Search & Table -->
        <div class="search-box">
            <input type="text" id="searchLetter" placeholder="🔍 पत्र खोज्नुहोस् (पत्र नं., फर्म, सवारी नं.)...">
            <button class="btn btn-primary" id="searchBtn" style="padding:0.5rem 1.2rem;"><i class="fas fa-search"></i> खोज</button>
            <button class="btn btn-outline" id="refreshBtn" style="padding:0.5rem 1.2rem;"><i class="fas fa-sync"></i> रिफ्रेस</button>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>क्र.सं.</th>
                        <th>पत्र नं.</th>
                        <th>मिति</th>
                        <th>फर्म</th>
                        <th>सवारी नं.</th>
                        <th style="text-align:center;">कार्य</th>
                    </tr>
                </thead>
                <tbody id="letterTableBody">
                    <tr>
                        <td colspan="6" style="text-align:center;padding:2rem;color:#5d7f92;">
                            <i class="fas fa-spinner fa-pulse"></i> लोड हुँदै...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // ============================================================
        // CONFIGURATION
        // ============================================================
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxcFUFZc9WBiyHVeOGg_wGW9aUgTrP0fQ4HC-teShB_qFv3hZEEZuNW5ohDNr_Svyl8/exec";

        let letterData = [];
        let lettersData = [];
        let isEditing = false;
        let allLetters = [];

        const toast = document.getElementById('toast');

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(msg, type = 'success') {
            toast.textContent = msg;
            toast.className = 'toast show ' + type;
            clearTimeout(toast._hideTimer);
            toast._hideTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        // ============================================================
        // FETCH AUTO LETTER NUMBER
        // ============================================================
        function fetchLetterNo() {
            fetch(`${SCRIPT_URL}?action=letterNo`)
                .then(r => r.json())
                .then(data => {
                    document.getElementById('letterNo').value = data.letterNo || 
                        'COT-' + new Date().getFullYear() + '-' + String(Math.floor(Math.random() * 9999)).padStart(4, '0');
                })
                .catch(() => {
                    document.getElementById('letterNo').value = 'COT-' + new Date().getFullYear() + '-' + 
                        String(Math.floor(Math.random() * 9999)).padStart(4, '0');
                });
        }

        // ============================================================
        // LOAD FIRMS
        // ============================================================
        function loadFirms() {
            const select = document.getElementById('firmName');
            select.innerHTML = '<option value="">लोड हुँदै...</option>';

            fetch(`${SCRIPT_URL}?action=firms`)
                .then(r => r.json())
                .then(data => {
                    select.innerHTML = '<option value="">छान्नुहोस्</option>';
                    if (data.length === 0) {
                        select.innerHTML = '<option value="">कुनै फर्म छैन</option>';
                        return;
                    }
                    data.forEach(row => {
                        const val = row.Firm_Name || '';
                        if (val) {
                            select.innerHTML += `<option value="${val}" data-address="${row.Address || ''}">${val}</option>`;
                        }
                    });
                })
                .catch(() => {
                    select.innerHTML = '<option value="">त्रुटि</option>';
                });
        }

        // ============================================================
        // LOAD APPLICATION NO (FROM LETTERS SHEET)
        // ============================================================
        function loadApplicationNumbers() {
            const select = document.getElementById('applicationNo');
            select.innerHTML = '<option value="">लोड हुँदै...</option>';

            fetch(`${SCRIPT_URL}?action=letters`)
                .then(r => r.json())
                .then(data => {
                    allLetters = Array.isArray(data) ? data : [];
                    select.innerHTML = '<option value="">छान्नुहोस्</option>';
                    if (allLetters.length === 0) {
                        select.innerHTML = '<option value="">कुनै निवेदन छैन</option>';
                        return;
                    }
                    
                    // Get unique Application_No values with their data
                    const uniqueApps = new Map();
                    allLetters.forEach(row => {
                        if (row.Application_No && row.Application_No.trim() !== '') {
                            if (!uniqueApps.has(row.Application_No)) {
                                uniqueApps.set(row.Application_No, row);
                            }
                        }
                    });
                    
                    if (uniqueApps.size === 0) {
                        select.innerHTML = '<option value="">कुनै निवेदन छैन</option>';
                        return;
                    }
                    
                    uniqueApps.forEach((row, appNo) => {
                        select.innerHTML += `<option value="${appNo}" data-id="${row.ID || ''}" data-vehicle="${row.Vehicle_No || ''}" data-details="${row.Repair_Reason || ''}">${appNo}</option>`;
                    });
                })
                .catch(() => {
                    select.innerHTML = '<option value="">त्रुटि</option>';
                });
        }

        // ============================================================
        // AUTO-FILL FIELDS WHEN APPLICATION NO IS SELECTED
        // ============================================================
        document.getElementById('applicationNo').addEventListener('change', function() {
            const selected = this.options[this.selectedIndex];
            const appNo = this.value;
            
            if (!appNo) {
                document.getElementById('vehicleNo').value = '';
                document.getElementById('repairDetails').value = '';
                return;
            }
            
            const vehicleNo = selected.getAttribute('data-vehicle') || '';
            const repairDetails = selected.getAttribute('data-details') || '';
            
            document.getElementById('vehicleNo').value = vehicleNo;
            document.getElementById('repairDetails').value = repairDetails;
        });

        // ============================================================
        // AUTO-FILL ADDRESS WHEN FIRM SELECTED
        // ============================================================
        document.getElementById('firmName').addEventListener('change', function() {
            const selected = this.options[this.selectedIndex];
            const address = selected.getAttribute('data-address') || '';
            document.getElementById('firmAddress').value = address;
        });

        // ============================================================
        // LOAD LETTERS LIST
        // ============================================================
        function loadLetters() {
            const tbody = document.getElementById('letterTableBody');
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:2rem;color:#5d7f92;">
                <i class="fas fa-spinner fa-pulse"></i> लोड हुँदै...</td></tr>`;

            fetch(`${SCRIPT_URL}?action=firmLetters`)
                .then(r => r.json())
                .then(data => {
                    letterData = Array.isArray(data) ? data : [];
                    renderLetters();
                })
                .catch(err => {
                    console.error('Load error:', err);
                    tbody.innerHTML =
                        `<tr><td colspan="6" style="text-align:center;padding:2rem;color:#a13d3d;">
                        <i class="fas fa-exclamation-circle"></i> लोड गर्न असफल</td></tr>`;
                });
        }

        // ============================================================
        // RENDER LETTERS
        // ============================================================
        function renderLetters() {
            const search = document.getElementById('searchLetter').value.toLowerCase();
            const filtered = letterData.filter(row => {
                const searchText = (row.Letter_No || '') + ' ' + (row.Firm_Name || '') + ' ' + (row.Vehicle_No || '');
                return searchText.toLowerCase().includes(search);
            });

            const tbody = document.getElementById('letterTableBody');

            if (filtered.length === 0) {
                tbody.innerHTML =
                    `<tr><td colspan="6" style="text-align:center;padding:2rem;color:#5d7f92;">कुनै पत्र छैन</td></tr>`;
                return;
            }

            let html = '';
            filtered.forEach((row, idx) => {
                html += `
                    <tr>
                        <td>${idx + 1}</td>
                        <td><strong>${row.Letter_No || '-'}</strong></td>
                        <td>${row.Letter_Date || '-'}</td>
                        <td>${row.Firm_Name || '-'}</td>
                        <td>${row.Vehicle_No || '-'}</td>
                        <td>
                            <div class="action-btns">
                                <button class="edit" onclick="editLetter('${row.ID}')"><i class="fas fa-edit"></i></button>
                                <button class="print-btn" onclick="printLetter('${row.ID}')"><i class="fas fa-print"></i></button>
                                <button class="delete" onclick="deleteLetter('${row.ID}')"><i class="fas fa-trash"></i></button>
                            </div>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        // ============================================================
        // FORM SUBMIT - Handles both Create and Update
        // ============================================================
        document.getElementById('firmLetterForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const date = document.getElementById('letterDate').value;
            const appNo = document.getElementById('applicationNo').value;
            const firm = document.getElementById('firmName').value;

            if (!date) { showToast('❌ कृपया मिति भर्नुहोस्', 'error');
                document.getElementById('letterDate').focus(); return; }
            if (!appNo) { showToast('❌ कृपया निवेदन नं. छान्नुहोस्', 'error');
                document.getElementById('applicationNo').focus(); return; }
            if (!firm) { showToast('❌ कृपया फर्म छान्नुहोस्', 'error');
                document.getElementById('firmName').focus(); return; }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> पठाउँदै...';

            const formData = new FormData(this);
            const params = new URLSearchParams();
            
            for (const [key, value] of formData.entries()) {
                params.append(key, value);
            }
            
            params.append('sheetName', 'FirmLetters');
            
            const editId = document.getElementById('editId').value;
            const isUpdate = editId && editId !== '';
            
            if (isUpdate) {
                params.append('_method', 'PUT');
                params.append('ID', editId);
            }

            fetch(SCRIPT_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: params.toString()
            })
            .then(r => r.json())
            .then(d => {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save"></i> सुरक्षित';
                
                if (d.result === 'success') {
                    showToast(isUpdate ? '✅ पत्र अद्यावधिक गरियो' : '✅ पत्र थपियो', 'success');
                    document.getElementById('firmLetterForm').reset();
                    document.getElementById('editId').value = '';
                    document.getElementById('editFormBtn').style.display = 'none';
                    document.getElementById('cancelEditBtn').style.display = 'none';
                    document.getElementById('formTitle').innerHTML = '<i class="fas fa-plus-circle"></i> नयाँ पत्र थप्नुहोस्';
                    isEditing = false;
                    loadLetters();
                    fetchLetterNo();
                    loadApplicationNumbers();
                } else {
                    showToast('❌ ' + (d.error || 'असफल'), 'error');
                }
            })
            .catch(err => {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save"></i> सुरक्षित';
                showToast('⚠️ सर्भर समस्या', 'error');
                console.error(err);
            });
        });

        // ============================================================
        // EDIT LETTER - Load data into form using ID
        // ============================================================
        function editLetter(id) {
            const row = letterData.find(r => String(r.ID) === String(id));
            if (!row) { 
                showToast('पत्र फेला परेन (ID: ' + id + ')', 'error'); 
                return; 
            }

            isEditing = true;
            document.getElementById('editId').value = row.ID;
            document.getElementById('applicationNo').value = row.Application_No || '';
            document.getElementById('letterNo').value = row.Letter_No || '';
            document.getElementById('letterDate').value = row.Letter_Date || '';
            document.getElementById('firmName').value = row.Firm_Name || '';
            document.getElementById('firmAddress').value = row.Firm_Address || '';
            document.getElementById('vehicleNo').value = row.Vehicle_No || '';
            document.getElementById('repairDetails').value = row.Repair_Details || '';

            document.getElementById('formTitle').innerHTML = '<i class="fas fa-edit"></i> पत्र सम्पादन गर्नुहोस्';
            document.getElementById('editFormBtn').style.display = 'inline-flex';
            document.getElementById('cancelEditBtn').style.display = 'inline-flex';
            document.getElementById('letterDate').focus();

            document.querySelector('.form-section').scrollIntoView({ behavior: 'smooth' });
        }

        // ============================================================
        // EDIT FORM BUTTON - Saves the edited data
        // ============================================================
        document.getElementById('editFormBtn').addEventListener('click', function() {
            document.getElementById('firmLetterForm').dispatchEvent(new Event('submit'));
        });

        // ============================================================
        // DELETE LETTER using ID
        // ============================================================
        function deleteLetter(id) {
            if (!confirm('के यो पत्र मेटाउने?')) return;

            const params = new URLSearchParams();
            params.append('sheetName', 'FirmLetters');
            params.append('ID', id);
            params.append('_method', 'DELETE');

            fetch(SCRIPT_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: params.toString()
            })
            .then(r => r.json())
            .then(d => {
                if (d.result === 'success') {
                    showToast('✅ पत्र मेटियो', 'success');
                    loadLetters();
                } else {
                    showToast('❌ ' + (d.error || 'मेटाउन असफल'), 'error');
                }
            })
            .catch(err => {
                showToast('⚠️ सर्भर समस्या', 'error');
                console.error(err);
            });
        }

        // ============================================================
        // PRINT LETTER FROM LIST using ID
        // ============================================================
        function printLetter(id) {
            if (!id) {
                showToast('❌ ID छैन', 'error');
                return;
            }

            const row = letterData.find(r => String(r.ID) === String(id));
            if (!row) {
                showToast('❌ पत्र फेला परेन (ID: ' + id + ')', 'error');
                return;
            }

            const data = {
                ID: row.ID || '',
                Letter_No: row.Letter_No || '',
                Letter_Date: row.Letter_Date || '',
                Application_No: row.Application_No || '',
                Firm_Name: row.Firm_Name || '',
                Firm_Address: row.Firm_Address || '',
                Vehicle_No: row.Vehicle_No || '',
                Repair_Details: row.Repair_Details || ''
            };

            openPrintPreview(data);
        }

        // ============================================================
        // OPEN PRINT PREVIEW
        // ============================================================
        function openPrintPreview(data) {
            try {
                sessionStorage.setItem('firmLetterPrintData', JSON.stringify(data));
            } catch (e) {
                const params = new URLSearchParams();
                Object.keys(data).forEach(key => params.append(key, data[key]));
                window.open(`firm-letter-print.html?${params.toString()}`, '_blank');
                return;
            }
            window.open('firm-letter-print.html', '_blank');
        }

        // ============================================================
        // RESET BUTTON
        // ============================================================
        document.getElementById('resetBtn').addEventListener('click', function() {
            if (isEditing) {
                if (!confirm('के तपाईं सम्पादन रद्द गरी फारम खाली गर्न चाहनुहुन्छ?')) return;
            }
            document.getElementById('firmLetterForm').reset();
            document.getElementById('editId').value = '';
            document.getElementById('editFormBtn').style.display = 'none';
            document.getElementById('cancelEditBtn').style.display = 'none';
            document.getElementById('formTitle').innerHTML = '<i class="fas fa-plus-circle"></i> नयाँ पत्र थप्नुहोस्';
            isEditing = false;
            fetchLetterNo();
            loadApplicationNumbers();
            showToast('फारम खाली गरियो', 'info');
        });

        // ============================================================
        // CANCEL EDIT BUTTON
        // ============================================================
        document.getElementById('cancelEditBtn').addEventListener('click', function() {
            document.getElementById('firmLetterForm').reset();
            document.getElementById('editId').value = '';
            this.style.display = 'none';
            document.getElementById('editFormBtn').style.display = 'none';
            document.getElementById('formTitle').innerHTML = '<i class="fas fa-plus-circle"></i> नयाँ पत्र थप्नुहोस्';
            isEditing = false;
            fetchLetterNo();
            loadApplicationNumbers();
            showToast('सम्पादन रद्द गरियो', 'info');
        });

        // ============================================================
        // DATE FORMAT
        // ============================================================
        document.getElementById('letterDate').addEventListener('input', function(e) {
            let v = e.target.value.replace(/\D/g, '');
            if (v.length >= 4) v = v.slice(0, 4) + '-' + v.slice(4);
            if (v.length >= 7) v = v.slice(0, 7) + '-' + v.slice(7, 9);
            e.target.value = v;
        });

        // ============================================================
        // SEARCH & REFRESH
        // ============================================================
        document.getElementById('searchBtn').addEventListener('click', renderLetters);
        document.getElementById('refreshBtn').addEventListener('click', loadLetters);
        document.getElementById('searchLetter').addEventListener('keyup', function(e) {
            if (e.key === 'Enter') renderLetters();
        });

        // ============================================================
        // INIT
        // ============================================================
        fetchLetterNo();
        loadFirms();
        loadApplicationNumbers();
        loadLetters();

        window.addEventListener('load', function() {
            const now = new Date();
            const year = now.getFullYear() + 57;
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const el = document.getElementById('letterDate');
            if (!el.value) {
                el.value = year + '-' + month + '-' + day;
            }
        });
    </script>
</body>
</html>
