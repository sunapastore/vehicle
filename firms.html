<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>फर्म व्यवस्थापन</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Nirmala UI', sans-serif;
        }

        body {
            background: #f0f4f8;
            padding: 1.5rem;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            background: #fff;
            border-radius: 28px;
            box-shadow: 0 20px 40px -10px rgba(0, 20, 30, 0.2);
            padding: 2rem 2.2rem;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            border-bottom: 3px solid #d0e2f0;
            padding-bottom: 0.8rem;
            margin-bottom: 1.5rem;
        }

        .top-bar h1 {
            font-size: 1.6rem;
            color: #0b2b3d;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .top-bar h1 i {
            color: #1a6f8f;
        }

        .back-btn {
            text-decoration: none;
            background: #e3ecf3;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            color: #1f4960;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .back-btn:hover {
            background: #d0dce6;
        }

        .form-section {
            background: #f8fafc;
            padding: 1.5rem;
            border-radius: 16px;
            margin-bottom: 1.5rem;
        }

        .form-section h3 {
            margin-bottom: 1rem;
            color: #0b2b3d;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0.8rem 1.2rem;
        }

        .form-grid .full-width {
            grid-column: 1 / -1;
        }

        .form-grid .field-group {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .form-grid label {
            font-weight: 600;
            font-size: 0.8rem;
            color: #1e4057;
        }

        .form-grid input,
        .form-grid textarea {
            padding: 0.5rem 0.8rem;
            border: 1px solid #dbe4eb;
            border-radius: 10px;
            font-size: 0.9rem;
            background: #fff;
            outline: none;
        }

        .form-grid input:focus,
        .form-grid textarea:focus {
            border-color: #2b7fa0;
            box-shadow: 0 0 0 3px rgba(35, 120, 160, 0.15);
        }

        .form-grid textarea {
            resize: vertical;
            min-height: 50px;
        }

        .btn-row {
            display: flex;
            gap: 0.8rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            padding: 0.5rem 1.8rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-primary {
            background: #1b6a89;
            color: #fff;
        }
        .btn-primary:hover {
            background: #0f5773;
        }
        .btn-success {
            background: #1d8a5f;
            color: #fff;
        }
        .btn-success:hover {
            background: #13724b;
        }
        .btn-danger {
            background: #dc3545;
            color: #fff;
        }
        .btn-danger:hover {
            background: #b02a37;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #b2ccdb;
            color: #1f4960;
        }
        .btn-outline:hover {
            background: #e2edf5;
        }
        .btn-warning {
            background: #ffc107;
            color: #1f4960;
        }
        .btn-warning:hover {
            background: #e0a800;
        }

        .table-wrap {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #e8f0f5;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            min-width: 600px;
        }

        th {
            background: #eef5fa;
            color: #1e4057;
            padding: 0.6rem 0.8rem;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #d0e2f0;
        }

        td {
            padding: 0.5rem 0.8rem;
            border-bottom: 1px solid #e8f0f5;
            vertical-align: middle;
        }

        tr:hover {
            background: #f8fafc;
        }

        .action-btns {
            display: flex;
            gap: 4px;
        }

        .action-btns button {
            border: none;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
        }

        .action-btns .edit {
            background: #d9e9f2;
            color: #004466;
        }
        .action-btns .edit:hover {
            background: #b5d4e3;
        }
        .action-btns .delete {
            background: #f8d7da;
            color: #721c24;
        }
        .action-btns .delete:hover {
            background: #f5c6cb;
        }

        .search-box {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .search-box input {
            padding: 0.5rem 1rem;
            border: 1px solid #dbe4eb;
            border-radius: 10px;
            font-size: 0.9rem;
            flex: 1;
            min-width: 200px;
            outline: none;
        }

        .search-box input:focus {
            border-color: #2b7fa0;
            box-shadow: 0 0 0 3px rgba(35, 120, 160, 0.15);
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: #0d3144;
            color: #fff;
            padding: 0.7rem 2rem;
            border-radius: 60px;
            font-weight: 500;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
            z-index: 999;
            opacity: 0;
            transition: 0.25s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }
        .toast.success {
            background: #1b7a56;
        }
        .toast.error {
            background: #a13d3d;
        }
        .toast.info {
            background: #0d6efd;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr 1fr;
            }
            .container {
                padding: 1rem;
            }
        }
        @media (max-width: 480px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .top-bar {
                flex-direction: column;
                align-items: flex-start;
            }
            .btn-row {
                flex-direction: column;
                align-items: stretch;
            }
            .btn {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <h1><i class="fas fa-building"></i> फर्म व्यवस्थापन</h1>
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> ड्यासबोर्ड</a>
        </div>

        <!-- Add/Edit Form -->
        <div class="form-section">
            <h3 id="formTitle"><i class="fas fa-plus-circle"></i> नयाँ फर्म थप्नुहोस्</h3>
            <form id="firmForm">
                <input type="hidden" id="editFirmId" name="Firm_ID">
                <div class="form-grid">
                    <div class="field-group">
                        <label>फर्मको नाम <span style="color:red;">*</span></label>
                        <input type="text" id="firmName" name="Firm_Name" required>
                    </div>
                    <div class="field-group">
                        <label>ठेगाना</label>
                        <input type="text" id="firmAddress" name="Address">
                    </div>
                    <div class="field-group">
                        <label>सम्पर्क व्यक्ति</label>
                        <input type="text" id="firmContactPerson" name="Contact_Person">
                    </div>
                    <div class="field-group">
                        <label>मोबाइल नं.</label>
                        <input type="text" id="firmMobile" name="Mobile_No">
                    </div>
                    <div class="field-group">
                        <label>PAN/VAT नं.</label>
                        <input type="text" id="firmPan" name="PAN_VAT_No">
                    </div>
                    <div class="field-group">
                        <label>दर्ता नं.</label>
                        <input type="text" id="firmRegNo" name="Registration_No">
                    </div>
                    <div class="field-group full-width">
                        <label>कैफियत</label>
                        <textarea id="firmRemarks" name="Remarks" rows="2"></textarea>
                    </div>
                </div>
                <div class="btn-row">
                    <button type="submit" class="btn btn-primary" id="submitBtn"><i class="fas fa-save"></i> सुरक्षित</button>
                    <button type="button" class="btn btn-warning" id="editFormBtn" style="display:none;"><i class="fas fa-edit"></i> सम्पादन</button>
                    <button type="button" class="btn btn-outline" id="resetFirmBtn"><i class="fas fa-undo-alt"></i> खाली</button>
                    <button type="button" class="btn btn-outline" id="cancelEditBtn" style="display:none;"><i class="fas fa-times"></i> रद्द</button>
                </div>
            </form>
        </div>

        <!-- Search & Table -->
        <div class="search-box">
            <input type="text" id="searchFirm" placeholder="🔍 फर्म खोज्नुहोस्...">
            <button class="btn btn-primary" id="searchFirmBtn" style="padding:0.5rem 1.2rem;"><i class="fas fa-search"></i> खोज</button>
            <button class="btn btn-outline" id="refreshFirmBtn" style="padding:0.5rem 1.2rem;"><i class="fas fa-sync"></i> रिफ्रेस</button>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>क्र.सं.</th>
                        <th>फर्मको नाम</th>
                        <th>ठेगाना</th>
                        <th>सम्पर्क</th>
                        <th>मोबाइल</th>
                        <th style="text-align:center;">कार्य</th>
                    </tr>
                </thead>
                <tbody id="firmTableBody">
                    <tr><td colspan="6" style="text-align:center;padding:2rem;color:#5d7f92;"><i class="fas fa-spinner fa-pulse"></i> लोड हुँदै...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // ============================================================
        // CONFIGURATION
        // ============================================================
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxlPhy_16N--T89myiSGwWlwXeC8Qrh8-5xRf6z7Gua8ATFtPMUpqlmHj7jCkKhi_6A/exec";

        let firmData = [];
        let isEditing = false;

        const toast = document.getElementById('toast');

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(msg, type = 'success') {
            toast.textContent = msg;
            toast.className = 'toast show ' + type;
            clearTimeout(toast._hideTimer);
            toast._hideTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        // ============================================================
        // LOAD FIRMS
        // ============================================================
        function loadFirms() {
            const tbody = document.getElementById('firmTableBody');
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:2rem;color:#5d7f92;">
                <i class="fas fa-spinner fa-pulse"></i> लोड हुँदै...</td></tr>`;

            fetch(`${SCRIPT_URL}?action=firms`)
                .then(r => r.json())
                .then(data => {
                    firmData = Array.isArray(data) ? data : [];
                    renderFirms();
                })
                .catch(err => {
                    console.error('Load error:', err);
                    tbody.innerHTML =
                        `<tr><td colspan="6" style="text-align:center;padding:2rem;color:#a13d3d;">
                        <i class="fas fa-exclamation-circle"></i> लोड गर्न असफल</td></tr>`;
                });
        }

        // ============================================================
        // RENDER FIRMS
        // ============================================================
        function renderFirms() {
            const search = document.getElementById('searchFirm').value.toLowerCase();
            const filtered = firmData.filter(row => String(row.Firm_Name).toLowerCase().includes(search));
            const tbody = document.getElementById('firmTableBody');

            if (filtered.length === 0) {
                tbody.innerHTML =
                    `<tr><td colspan="6" style="text-align:center;padding:2rem;color:#5d7f92;">कुनै फर्म छैन</td></tr>`;
                return;
            }

            let html = '';
            filtered.forEach((row, idx) => {
                html += `
                    <tr>
                        <td>${idx + 1}</td>
                        <td><strong>${row.Firm_Name || '-'}</strong></td>
                        <td>${row.Address || '-'}</td>
                        <td>${row.Contact_Person || '-'}</td>
                        <td>${row.Mobile_No || '-'}</td>
                        <td>
                            <div class="action-btns">
                                <button class="edit" onclick="editFirm('${row.Firm_ID}')"><i class="fas fa-edit"></i></button>
                                <button class="delete" onclick="deleteFirm('${row.Firm_ID}')"><i class="fas fa-trash"></i></button>
                            </div>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        // ============================================================
        // FORM SUBMIT - Handles both Create and Update
        // ============================================================
        document.getElementById('firmForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const firmName = document.getElementById('firmName').value.trim();
            if (!firmName) {
                showToast('❌ कृपया फर्मको नाम भर्नुहोस्', 'error');
                document.getElementById('firmName').focus();
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> पठाउँदै...';

            // Get form data as URLSearchParams
            const formData = new FormData(this);
            const params = new URLSearchParams();
            
            for (const [key, value] of formData.entries()) {
                params.append(key, value);
            }
            
            params.append('sheetName', 'Firms');
            
            const firmId = document.getElementById('editFirmId').value;
            const isUpdate = firmId && firmId !== '';
            
            if (isUpdate) {
                params.append('_method', 'PUT');
            }

            fetch(SCRIPT_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: params.toString()
            })
            .then(r => r.json())
            .then(d => {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save"></i> सुरक्षित';
                
                if (d.result === 'success') {
                    showToast(isUpdate ? '✅ फर्म अद्यावधिक गरियो' : '✅ फर्म थपियो', 'success');
                    document.getElementById('firmForm').reset();
                    document.getElementById('editFirmId').value = '';
                    document.getElementById('editFormBtn').style.display = 'none';
                    document.getElementById('cancelEditBtn').style.display = 'none';
                    document.getElementById('formTitle').innerHTML = '<i class="fas fa-plus-circle"></i> नयाँ फर्म थप्नुहोस्';
                    isEditing = false;
                    loadFirms();
                } else {
                    showToast('❌ ' + (d.error || 'असफल'), 'error');
                }
            })
            .catch(err => {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save"></i> सुरक्षित';
                showToast('⚠️ सर्भर समस्या', 'error');
                console.error(err);
            });
        });

        // ============================================================
        // EDIT FIRM - Load data into form
        // ============================================================
        function editFirm(id) {
            const row = firmData.find(r => r.Firm_ID == id);
            if (!row) { showToast('फर्म फेला परेन', 'error'); return; }

            isEditing = true;
            document.getElementById('editFirmId').value = row.Firm_ID;
            document.getElementById('firmName').value = row.Firm_Name || '';
            document.getElementById('firmAddress').value = row.Address || '';
            document.getElementById('firmContactPerson').value = row.Contact_Person || '';
            document.getElementById('firmMobile').value = row.Mobile_No || '';
            document.getElementById('firmPan').value = row.PAN_VAT_No || '';
            document.getElementById('firmRegNo').value = row.Registration_No || '';
            document.getElementById('firmRemarks').value = row.Remarks || '';

            document.getElementById('formTitle').innerHTML = '<i class="fas fa-edit"></i> फर्म सम्पादन गर्नुहोस्';
            document.getElementById('editFormBtn').style.display = 'inline-flex';
            document.getElementById('cancelEditBtn').style.display = 'inline-flex';
            document.getElementById('firmName').focus();
        }

        // ============================================================
        // EDIT FORM BUTTON - Saves the edited data
        // ============================================================
        document.getElementById('editFormBtn').addEventListener('click', function() {
            document.getElementById('firmForm').dispatchEvent(new Event('submit'));
        });

        // ============================================================
        // DELETE FIRM
        // ============================================================
        function deleteFirm(id) {
            if (!confirm('के यो फर्म मेटाउने?')) return;

            const params = new URLSearchParams();
            params.append('sheetName', 'Firms');
            params.append('Firm_ID', id);
            params.append('_method', 'DELETE');

            fetch(SCRIPT_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: params.toString()
            })
            .then(r => r.json())
            .then(d => {
                if (d.result === 'success') {
                    showToast('✅ फर्म मेटियो', 'success');
                    loadFirms();
                } else {
                    showToast('❌ ' + (d.error || 'मेटाउन असफल'), 'error');
                }
            })
            .catch(err => {
                showToast('⚠️ सर्भर समस्या', 'error');
                console.error(err);
            });
        }

        // ============================================================
        // RESET BUTTON
        // ============================================================
        document.getElementById('resetFirmBtn').addEventListener('click', function() {
            if (isEditing) {
                if (!confirm('के तपाईं सम्पादन रद्द गरी फारम खाली गर्न चाहनुहुन्छ?')) return;
            }
            document.getElementById('firmForm').reset();
            document.getElementById('editFirmId').value = '';
            document.getElementById('editFormBtn').style.display = 'none';
            document.getElementById('cancelEditBtn').style.display = 'none';
            document.getElementById('formTitle').innerHTML = '<i class="fas fa-plus-circle"></i> नयाँ फर्म थप्नुहोस्';
            isEditing = false;
            showToast('फारम खाली गरियो', 'info');
        });

        // ============================================================
        // CANCEL EDIT BUTTON
        // ============================================================
        document.getElementById('cancelEditBtn').addEventListener('click', function() {
            document.getElementById('firmForm').reset();
            document.getElementById('editFirmId').value = '';
            this.style.display = 'none';
            document.getElementById('editFormBtn').style.display = 'none';
            document.getElementById('formTitle').innerHTML = '<i class="fas fa-plus-circle"></i> नयाँ फर्म थप्नुहोस्';
            isEditing = false;
            showToast('सम्पादन रद्द गरियो', 'info');
        });

        // ============================================================
        // SEARCH & REFRESH
        // ============================================================
        document.getElementById('searchFirmBtn').addEventListener('click', renderFirms);
        document.getElementById('refreshFirmBtn').addEventListener('click', loadFirms);
        document.getElementById('searchFirm').addEventListener('keyup', function(e) {
            if (e.key === 'Enter') renderFirms();
        });

        // ============================================================
        // INIT
        // ============================================================
        loadFirms();
    </script>
</body>
</html>
