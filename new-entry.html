<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>नयाँ मर्मत निवेदन</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Nirmala UI', sans-serif;
        }

        body {
            background: #f0f4f8;
            padding: 1.5rem;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            background: #fff;
            border-radius: 28px;
            box-shadow: 0 20px 40px -10px rgba(0, 20, 30, 0.2);
            padding: 2rem 2.2rem;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            border-bottom: 3px solid #d0e2f0;
            padding-bottom: 0.8rem;
            margin-bottom: 1.8rem;
        }

        .top-bar h1 {
            font-size: 1.6rem;
            color: #0b2b3d;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .top-bar h1 i {
            color: #1a6f8f;
        }

        .back-btn {
            text-decoration: none;
            background: #e3ecf3;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            color: #1f4960;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .back-btn:hover {
            background: #d0dce6;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1rem 1.5rem;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        label {
            font-weight: 600;
            font-size: 0.82rem;
            color: #1e4057;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        label i {
            color: #3a7b97;
            width: 1rem;
        }

        .required {
            color: #dc3545;
            font-weight: 700;
        }

        input,
        select,
        textarea {
            padding: 0.6rem 0.9rem;
            border: 1px solid #dbe4eb;
            border-radius: 12px;
            font-size: 0.92rem;
            background: #fbfdff;
            transition: 0.2s;
            width: 100%;
            outline: none;
            color: #0b2b3d;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2b7fa0;
            box-shadow: 0 0 0 3px rgba(35, 120, 160, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        .readonly-input {
            background: #eef4f9;
            color: #1f4a61;
            font-weight: 500;
            border-color: #cbdbe7;
        }

        .section-divider {
            grid-column: 1 / -1;
            border-top: 2px solid #e8f0f5;
            padding-top: 0.5rem;
            margin-top: 0.3rem;
            color: #1a6f8f;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .action-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: flex-end;
            gap: 0.8rem;
            margin-top: 1.8rem;
            padding-top: 1.5rem;
            border-top: 2px dashed #dce8f0;
        }

        .btn {
            border: none;
            padding: 0.7rem 2rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.15s;
        }

        .btn-primary {
            background: #1b6a89;
            color: #fff;
            box-shadow: 0 4px 12px rgba(22, 90, 120, 0.25);
        }

        .btn-primary:hover {
            background: #0f5773;
        }

        .btn-danger {
            background: #dc3545;
            color: #fff;
        }

        .btn-danger:hover {
            background: #b02a37;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #b2ccdb;
            color: #1f4960;
        }

        .btn-outline:hover {
            background: #e2edf5;
        }

        .table-wrap {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #e8f0f5;
            margin-top: 1.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
            min-width: 700px;
        }

        th {
            background: #eef5fa;
            color: #1e4057;
            padding: 0.6rem 0.6rem;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #d0e2f0;
            white-space: nowrap;
        }

        td {
            padding: 0.4rem 0.6rem;
            border-bottom: 1px solid #e8f0f5;
            vertical-align: middle;
        }

        tr:hover {
            background: #f8fafc;
        }

        .action-btns {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .action-btns button {
            border: none;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.2s;
        }

        .action-btns .edit {
            background: #d9e9f2;
            color: #004466;
        }
        .action-btns .edit:hover {
            background: #b5d4e3;
        }

        .action-btns .print-btn {
            background: #d4edda;
            color: #155724;
        }
        .action-btns .print-btn:hover {
            background: #b7dfc6;
        }

        .action-btns .delete {
            background: #f8d7da;
            color: #721c24;
        }
        .action-btns .delete:hover {
            background: #f5c6cb;
        }

        .search-box {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .search-box input {
            padding: 0.5rem 1rem;
            border: 1px solid #dbe4eb;
            border-radius: 10px;
            font-size: 0.9rem;
            flex: 1;
            min-width: 200px;
            outline: none;
        }

        .search-box input:focus {
            border-color: #2b7fa0;
            box-shadow: 0 0 0 3px rgba(35, 120, 160, 0.15);
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: #0d3144;
            color: #fff;
            padding: 0.7rem 2rem;
            border-radius: 60px;
            font-weight: 500;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
            z-index: 999;
            opacity: 0;
            transition: 0.25s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }
        .toast.success {
            background: #1b7a56;
        }
        .toast.error {
            background: #a13d3d;
        }
        .toast.info {
            background: #0d6efd;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1.2rem;
            }
            .form-grid {
                grid-template-columns: 1fr 1fr;
            }
            .top-bar {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        @media (max-width: 480px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .action-row {
                flex-direction: column;
                align-items: stretch;
            }
            .btn {
                justify-content: center;
            }
            .search-box {
                flex-direction: column;
            }
            .search-box input {
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <h1><i class="fas fa-plus-circle"></i> नयाँ मर्मत आदेश</h1>
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> ड्यासबोर्ड</a>
        </div>

        <form id="repairForm" novalidate>
            <div class="form-grid">
                <div class="section-divider"><i class="fas fa-info-circle"></i> आधारभूत जानकारी</div>

                <!-- Application No - Dropdown from Letters sheet using ID -->
                <div class="field-group">
                    <label><i class="fas fa-hashtag"></i> निवेदन नं. <span class="required">*</span></label>
                    <select id="Application_No" name="Application_No" required>
                        <option value="">लोड हुँदै...</option>
                    </select>
                </div>

                <div class="field-group">
                    <label><i class="fas fa-calendar-plus"></i> दर्ता मिति <span class="required">*</span></label>
                    <input type="text" id="Entry_Date" name="Entry_Date" placeholder="2082-03-11" maxlength="10" required>
                </div>

                <div class="field-group">
                    <label><i class="fas fa-calendar-alt"></i> आर्थिक वर्ष</label>
                    <select id="Fiscal_Year" name="Fiscal_Year">
                        <option value="२०७९/८०">२०७९/८०</option>
                        <option value="२०८०/८१">२०८०/८१</option>
                        <option value="२०८१/८२" selected>२०८१/८२</option>
                        <option value="२०८२/८३">२०८२/८३</option>
                        <option value="२०८३/८४">२०८३/८४</option>
                        <option value="२०८४/८५">२०८४/८५</option>
                    </select>
                </div>

                <div class="section-divider"><i class="fas fa-truck"></i> सवारी विवरण</div>

                <div class="field-group">
                    <label><i class="fas fa-truck"></i> सवारी नं. <span class="required">*</span></label>
                    <input type="text" id="Vehicle_No" name="Vehicle_No" class="readonly-input" readonly>
                </div>

                <div class="field-group">
                    <label><i class="fas fa-car"></i> सवारी प्रकार</label>
                    <input type="text" id="Vehicle_Type" name="Vehicle_Type" class="readonly-input" readonly>
                </div>

                <div class="field-group">
                    <label><i class="fas fa-cogs"></i> सवारी मोडेल</label>
                    <input type="text" id="Vehicle_Model" name="Vehicle_Model" class="readonly-input" readonly>
                </div>

                <div class="field-group">
                    <label><i class="fas fa-qrcode"></i> सामान पहिचान नं.</label>
                    <input type="text" id="Item_Identification_No" name="Item_Identification_No" class="readonly-input" readonly>
                </div>

                <div class="field-group">
                    <label><i class="fas fa-box"></i> मर्मत गर्नुपर्ने सामान</label>
                    <input type="text" id="Item_Name" name="Item_Name" class="readonly-input" readonly>
                </div>

                <div class="section-divider"><i class="fas fa-tools"></i> मर्मत विवरण</div>

                <div class="field-group">
                    <label><i class="fas fa-coins"></i> अनुमानित लागत (रु.)</label>
                    <input type="number" id="Estimated_Repair_Cost" name="Estimated_Repair_Cost" placeholder="०" step="0.01">
                </div>

                <div class="field-group">
                    <label><i class="fas fa-building"></i> मर्मत गर्ने फर्म</label>
                    <select id="Workshop_Firm" name="Workshop_Firm">
                        <option value="">लोड हुँदै...</option>
                    </select>
                </div>

                <div class="field-group">
                    <label><i class="fas fa-user"></i> चालकको नाम</label>
                    <input type="text" id="Driver_Name" name="Driver_Name" class="readonly-input" readonly>
                </div>

                <div class="field-group">
                    <label><i class="fas fa-history"></i> अघिल्लो मर्मत संख्या</label>
                    <input type="number" id="Previous_Repair_Count" name="Previous_Repair_Count" placeholder="०" readonly>
                </div>

                <div class="field-group">
                    <label><i class="fas fa-calendar-day"></i> अघिल्लो मर्मत मिति</label>
                    <input type="text" id="Previous_Repair_Date" name="Previous_Repair_Date" placeholder="2081-10-15" maxlength="10" readonly>
                </div>

                <div class="field-group">
                    <label><i class="fas fa-money-bill-wave"></i> अघिल्लो लागत</label>
                    <input type="number" id="Previous_Repair_Cost" name="Previous_Repair_Cost" placeholder="०" step="0.01" readonly>
                </div>

                <div class="section-divider"><i class="fas fa-users"></i> कर्मचारी विवरण</div>

                <div class="field-group">
                    <label><i class="fas fa-user-tie"></i> आदेश दिने अधिकारी</label>
                    <input type="text" id="Ordered_By" name="Ordered_By" placeholder="अधिकारीको नाम">
                </div>

                <div class="field-group">
                    <label><i class="fas fa-sitemap"></i> शाखा / विभाग</label>
                    <input type="text" id="Department" name="Department" placeholder="शाखा">
                </div>

                <div class="field-group">
                    <label><i class="fas fa-user-circle"></i> निवेदकको नाम</label>
                    <select id="Applicant_Name" name="Applicant_Name">
                        <option value="">लोड हुँदै...</option>
                    </select>
                </div>

                <div class="field-group">
                    <label><i class="fas fa-flag"></i> स्थिति</label>
                    <select id="Status" name="Status">
                        <option value="पेन्डिङ">पेन्डिङ</option>
                        <option value="स्वीकृत">स्वीकृत</option>
                        <option value="अस्वीकृत">अस्वीकृत</option>
                        <option value="सम्पन्न">सम्पन्न</option>
                    </select>
                </div>

                <div class="section-divider"><i class="fas fa-pen"></i> विवरण / टिप्पणी</div>

                <div class="field-group full-width">
                    <label><i class="fas fa-exclamation-triangle"></i> मर्मत गर्नुपर्ने कारण</label>
                    <textarea id="Repair_Reason" name="Repair_Reason" rows="2" class="readonly-input" readonly></textarea>
                </div>

                <div class="field-group full-width">
                    <label><i class="fas fa-pen"></i> कैफियत / टिप्पणी</label>
                    <textarea id="Remarks" name="Remarks" rows="2" placeholder="अतिरिक्त जानकारी"></textarea>
                </div>

                <input type="hidden" name="sheetName" value="Repairs">
            </div>

            <div class="action-row">
                <button type="button" class="btn btn-outline" id="resetBtn"><i class="fas fa-undo-alt"></i> खाली</button>
                <button type="submit" class="btn btn-primary" id="saveBtn"><i class="fas fa-save"></i> सुरक्षित</button>
            </div>
        </form>

        <!-- Search & Table -->
        <div class="search-box">
            <input type="text" id="searchRepair" placeholder="🔍 मर्मत खोज्नुहोस् (निवेदन नं., सवारी नं., निवेदक)...">
            <button class="btn btn-primary" id="searchBtn" style="padding:0.5rem 1.2rem;"><i class="fas fa-search"></i> खोज</button>
            <button class="btn btn-outline" id="refreshBtn" style="padding:0.5rem 1.2rem;"><i class="fas fa-sync"></i> रिफ्रेस</button>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>क्र.सं.</th>
                        <th>निवेदन नं.</th>
                        <th>मिति</th>
                        <th>सवारी नं.</th>
                        <th>निवेदक</th>
                        <th style="text-align:center;">कार्य</th>
                    </tr>
                </thead>
                <tbody id="repairTableBody">
                    <tr>
                        <td colspan="6" style="text-align:center;padding:2rem;color:#5d7f92;">
                            <i class="fas fa-spinner fa-pulse"></i> लोड हुँदै...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzIv7ViOqv7v0Acip6yH71osrwE809kD6BQK0GIqoGrR1m0oFfI8otDBtQ5D0XH1afn/exec";
        const form = document.getElementById('repairForm');
        const toast = document.getElementById('toast');

        let lettersData = [];
        let vehiclesData = [];
        let repairsData = [];
        let driversData = [];
        let firmsData = [];
        let repairListData = [];
        let isEditing = false;
        let editingId = null;

        function showToast(msg, type = 'success') {
            toast.textContent = msg;
            toast.className = 'toast show ' + type;
            clearTimeout(toast._hideTimer);
            toast._hideTimer = setTimeout(() => { toast.classList.remove('show'); }, 3500);
        }

        // ============================================================
        // FORMAT DATE - Extracts only date part from ISO string
        // ============================================================
        function formatDateOnly(dateStr) {
            if (!dateStr) return '';
            if (dateStr.includes('T')) {
                return dateStr.split('T')[0];
            }
            return dateStr;
        }

        // ============================================================
        // LOAD ALL DATA
        // ============================================================
        function loadAllData() {
            Promise.all([
                fetch(`${SCRIPT_URL}?action=letters`).then(r => r.json()),
                fetch(`${SCRIPT_URL}?action=vehicles`).then(r => r.json()),
                fetch(`${SCRIPT_URL}?action=repairs`).then(r => r.json()),
                fetch(`${SCRIPT_URL}?action=drivers`).then(r => r.json()),
                fetch(`${SCRIPT_URL}?action=firms`).then(r => r.json())
            ])
            .then(([letters, vehicles, repairs, drivers, firms]) => {
                lettersData = Array.isArray(letters) ? letters : [];
                vehiclesData = Array.isArray(vehicles) ? vehicles : [];
                repairsData = Array.isArray(repairs) ? repairs : [];
                driversData = Array.isArray(drivers) ? drivers : [];
                firmsData = Array.isArray(firms) ? firms : [];
                
                populateApplicationNoDropdown();
                populateDropdowns();
                loadRepairList();
            })
            .catch(err => {
                console.error('Error loading data:', err);
                showToast('⚠️ डाटा लोड गर्न समस्या', 'error');
            });
        }

        // ============================================================
        // POPULATE APPLICATION NO DROPDOWN - Using ID from Letters sheet
        // ============================================================
        function populateApplicationNoDropdown() {
            const select = document.getElementById('Application_No');
            select.innerHTML = '<option value="">छान्नुहोस्</option>';
            
            if (lettersData.length === 0) {
                select.innerHTML = '<option value="">कुनै निवेदन छैन</option>';
                return;
            }
            
            lettersData.forEach(row => {
                if (row.ID && row.Application_No && row.Application_No.trim() !== '') {
                    const label = row.Application_No + (row.Vehicle_No ? ' (' + row.Vehicle_No + ')' : '');
                    select.innerHTML += `<option value="${row.ID}" data-vehicle="${row.Vehicle_No || ''}" data-driver="${row.Driver_Name || ''}" data-applicant="${row.Applicant_Name || ''}" data-reason="${row.Repair_Reason || ''}" data-date="${row.Letter_Date || ''}" data-item="${row.Item_Name || ''}">${label}</option>`;
                }
            });
            
            if (select.options.length === 1) {
                select.innerHTML = '<option value="">कुनै निवेदन छैन</option>';
            }
        }

        // ============================================================
        // POPULATE OTHER DROPDOWNS
        // ============================================================
        function populateDropdowns() {
            // Workshop Firm dropdown
            const firmSelect = document.getElementById('Workshop_Firm');
            firmSelect.innerHTML = '<option value="">छान्नुहोस्</option>';
            if (firmsData.length > 0) {
                const uniqueFirms = new Set();
                firmsData.forEach(row => {
                    if (row.Firm_Name && row.Firm_Name.trim() !== '') {
                        uniqueFirms.add(row.Firm_Name);
                    }
                });
                uniqueFirms.forEach(firm => {
                    firmSelect.innerHTML += `<option value="${firm}">${firm}</option>`;
                });
            } else {
                firmSelect.innerHTML = '<option value="">कुनै फर्म छैन</option>';
            }

            // Applicant Name dropdown from Drivers sheet
            const applicantSelect = document.getElementById('Applicant_Name');
            applicantSelect.innerHTML = '<option value="">छान्नुहोस्</option>';
            if (driversData.length > 0) {
                const uniqueDrivers = new Set();
                driversData.forEach(row => {
                    if (row.Driver_Name && row.Driver_Name.trim() !== '') {
                        uniqueDrivers.add(row.Driver_Name);
                    }
                });
                uniqueDrivers.forEach(driver => {
                    applicantSelect.innerHTML += `<option value="${driver}">${driver}</option>`;
                });
            } else {
                applicantSelect.innerHTML = '<option value="">कुनै चालक छैन</option>';
            }
        }

        // ============================================================
        // LOAD LETTER DETAILS - When Application No (ID) is selected
        // ============================================================
        function loadLetterDetails(id) {
            if (!id) {
                clearAllFields();
                return;
            }

            const letter = lettersData.find(row => String(row.ID) === String(id));
            if (!letter) {
                showToast('❌ निवेदन फेला परेन', 'error');
                clearAllFields();
                return;
            }

            const vehicle = vehiclesData.find(row => row.Vehicle_No === letter.Vehicle_No);

            document.getElementById('Entry_Date').value = letter.Entry_Date || letter.Letter_Date || '';
            document.getElementById('Vehicle_No').value = letter.Vehicle_No || '';
            document.getElementById('Vehicle_Type').value = vehicle ? vehicle.Vehicle_Type || '' : '';
            document.getElementById('Vehicle_Model').value = vehicle ? vehicle.Vehicle_Model || '' : '';
            document.getElementById('Item_Identification_No').value = letter.Item_Identification_No || letter.Item_Name || '';
            document.getElementById('Item_Name').value = letter.Item_Name || '';
            document.getElementById('Driver_Name').value = letter.Driver_Name || '';
            document.getElementById('Repair_Reason').value = letter.Repair_Reason || '';
            
            if (letter.Applicant_Name) {
                document.getElementById('Applicant_Name').value = letter.Applicant_Name;
            }

            if (letter.Vehicle_No) {
                loadPreviousRepairs(letter.Vehicle_No);
            }
        }

        // ============================================================
        // LOAD PREVIOUS REPAIRS - FIXED: Uses formatDateOnly for date
        // ============================================================
        function loadPreviousRepairs(vehicleNo) {
            if (!vehicleNo) {
                document.getElementById('Previous_Repair_Count').value = '';
                document.getElementById('Previous_Repair_Date').value = '';
                document.getElementById('Previous_Repair_Cost').value = '';
                return;
            }

            const repairs = repairsData.filter(row => row.Vehicle_No === vehicleNo);
            
            if (repairs.length > 0) {
                const latest = repairs[repairs.length - 1];
                document.getElementById('Previous_Repair_Count').value = repairs.length;
                // FIXED: Format date to remove time component
                document.getElementById('Previous_Repair_Date').value = formatDateOnly(latest.Entry_Date) || '';
                document.getElementById('Previous_Repair_Cost').value = latest.Estimated_Repair_Cost || '';
            } else {
                document.getElementById('Previous_Repair_Count').value = '';
                document.getElementById('Previous_Repair_Date').value = '';
                document.getElementById('Previous_Repair_Cost').value = '';
            }
        }

        // ============================================================
        // CLEAR ALL FIELDS
        // ============================================================
        function clearAllFields() {
            document.getElementById('Entry_Date').value = '';
            document.getElementById('Vehicle_No').value = '';
            document.getElementById('Vehicle_Type').value = '';
            document.getElementById('Vehicle_Model').value = '';
            document.getElementById('Item_Identification_No').value = '';
            document.getElementById('Item_Name').value = '';
            document.getElementById('Driver_Name').value = '';
            document.getElementById('Applicant_Name').value = '';
            document.getElementById('Repair_Reason').value = '';
            document.getElementById('Previous_Repair_Count').value = '';
            document.getElementById('Previous_Repair_Date').value = '';
            document.getElementById('Previous_Repair_Cost').value = '';
        }

        // ============================================================
        // LOAD REPAIR LIST
        // ============================================================
        function loadRepairList() {
            const tbody = document.getElementById('repairTableBody');
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:2rem;color:#5d7f92;">
                <i class="fas fa-spinner fa-pulse"></i> लोड हुँदै...</td></tr>`;

            fetch(`${SCRIPT_URL}?action=repairs`)
                .then(r => r.json())
                .then(data => {
                    repairListData = Array.isArray(data) ? data : [];
                    renderRepairList();
                })
                .catch(err => {
                    console.error('Load error:', err);
                    tbody.innerHTML =
                        `<tr><td colspan="6" style="text-align:center;padding:2rem;color:#a13d3d;">
                        <i class="fas fa-exclamation-circle"></i> लोड गर्न असफल</td></tr>`;
                });
        }

        // ============================================================
        // RENDER REPAIR LIST
        // ============================================================
        function renderRepairList() {
            const search = document.getElementById('searchRepair').value.toLowerCase();
            const filtered = repairListData.filter(row => {
                const searchText = (row.Application_No || '') + ' ' + (row.Vehicle_No || '') + ' ' + (row.Applicant_Name || '');
                return searchText.toLowerCase().includes(search);
            });

            const tbody = document.getElementById('repairTableBody');

            if (filtered.length === 0) {
                tbody.innerHTML =
                    `<tr><td colspan="6" style="text-align:center;padding:2rem;color:#5d7f92;">कुनै रेकर्ड छैन</td></tr>`;
                return;
            }

            let html = '';
            filtered.forEach((row, idx) => {
                html += `
                    <tr>
                        <td>${idx + 1}</td>
                        <td><strong>${row.Application_No || '-'}</strong></td>
                        <td>${row.Entry_Date || '-'}</td>
                        <td>${row.Vehicle_No || '-'}</td>
                        <td>${row.Applicant_Name || '-'}</td>
                        <td>
                            <div class="action-btns">
                                <button class="edit" onclick="editRecord('${row.ID}')"><i class="fas fa-edit"></i></button>
                                <button class="print-btn" onclick="printRecord('${row.Application_No}')"><i class="fas fa-print"></i></button>
                                <button class="delete" onclick="deleteRecord('${row.ID}')"><i class="fas fa-trash"></i></button>
                            </div>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        // ============================================================
        // EDIT RECORD
        // ============================================================
        function editRecord(id) {
            const row = repairListData.find(r => String(r.ID) === String(id));
            if (!row) { showToast('रेकर्ड फेला परेन', 'error'); return; }

            isEditing = true;
            editingId = id;
            
            document.getElementById('Application_No').value = id;
            
            document.getElementById('Fiscal_Year').value = row.Fiscal_Year || '२०८१/८२';
            document.getElementById('Entry_Date').value = row.Entry_Date || '';
            document.getElementById('Vehicle_No').value = row.Vehicle_No || '';
            document.getElementById('Vehicle_Type').value = row.Vehicle_Type || '';
            document.getElementById('Vehicle_Model').value = row.Vehicle_Model || '';
            document.getElementById('Item_Identification_No').value = row.Item_Identification_No || '';
            document.getElementById('Item_Name').value = row.Item_Name || '';
            document.getElementById('Estimated_Repair_Cost').value = row.Estimated_Repair_Cost || '';
            document.getElementById('Workshop_Firm').value = row.Workshop_Firm || '';
            document.getElementById('Driver_Name').value = row.Driver_Name || '';
            document.getElementById('Ordered_By').value = row.Ordered_By || '';
            document.getElementById('Department').value = row.Department || '';
            document.getElementById('Applicant_Name').value = row.Applicant_Name || '';
            document.getElementById('Status').value = row.Status || 'पेन्डिङ';
            document.getElementById('Repair_Reason').value = row.Repair_Reason || '';
            document.getElementById('Remarks').value = row.Remarks || '';
            
            // Load previous repair data for this vehicle
            if (row.Vehicle_No) {
                const repairs = repairsData.filter(r => r.Vehicle_No === row.Vehicle_No);
                if (repairs.length > 0) {
                    const latest = repairs[repairs.length - 1];
                    document.getElementById('Previous_Repair_Count').value = repairs.length;
                    document.getElementById('Previous_Repair_Date').value = formatDateOnly(latest.Entry_Date) || '';
                    document.getElementById('Previous_Repair_Cost').value = latest.Estimated_Repair_Cost || '';
                }
            }

            document.querySelector('.form-section').scrollIntoView({ behavior: 'smooth' });
        }

        // ============================================================
        // PRINT RECORD
        // ============================================================
        function printRecord(appNo) {
            if (!appNo) { 
                showToast('निवेदन नं. छैन', 'error'); 
                return; 
            }
            
            const printUrl = `print.html?appNo=${encodeURIComponent(appNo)}`;
            window.open(printUrl, '_blank');
        }

        // ============================================================
        // DELETE RECORD
        // ============================================================
        function deleteRecord(id) {
            if (!confirm('के तपाईं यो रेकर्ड मेटाउन चाहनुहुन्छ?')) return;

            const params = new URLSearchParams();
            params.append('sheetName', 'Repairs');
            params.append('ID', id);
            params.append('_method', 'DELETE');

            fetch(SCRIPT_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: params.toString()
            })
            .then(r => r.json())
            .then(d => {
                if (d.result === 'success') {
                    showToast('✅ रेकर्ड मेटियो', 'success');
                    loadRepairList();
                } else {
                    showToast('❌ ' + (d.error || 'मेटाउन असफल'), 'error');
                }
            })
            .catch(err => {
                showToast('⚠️ सर्भर समस्या', 'error');
                console.error(err);
            });
        }

        // ============================================================
        // EVENT LISTENERS
        // ============================================================
        document.getElementById('Application_No').addEventListener('change', function() {
            loadLetterDetails(this.value);
        });

        document.getElementById('Entry_Date').addEventListener('input', function(e) {
            let v = e.target.value.replace(/\D/g, '');
            if (v.length >= 4) v = v.slice(0, 4) + '-' + v.slice(4);
            if (v.length >= 7) v = v.slice(0, 7) + '-' + v.slice(7, 9);
            e.target.value = v;
        });
        document.getElementById('Previous_Repair_Date').addEventListener('input', function(e) {
            let v = e.target.value.replace(/\D/g, '');
            if (v.length >= 4) v = v.slice(0, 4) + '-' + v.slice(4);
            if (v.length >= 7) v = v.slice(0, 7) + '-' + v.slice(7, 9);
            e.target.value = v;
        });

        document.getElementById('searchBtn').addEventListener('click', renderRepairList);
        document.getElementById('refreshBtn').addEventListener('click', loadRepairList);
        document.getElementById('searchRepair').addEventListener('keyup', function(e) {
            if (e.key === 'Enter') renderRepairList();
        });

        // ============================================================
        // SUBMIT FORM - FIXED: Ensures Previous_Repair_Cost is sent
        // ============================================================
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Validate required fields
            const entryDate = document.getElementById('Entry_Date').value;
            const appId = document.getElementById('Application_No').value;
            
            if (!entryDate) { 
                showToast('❌ दर्ता मिति भर्नुहोस्', 'error');
                document.getElementById('Entry_Date').focus(); 
                return; 
            }
            
            if (!appId) { 
                showToast('❌ निवेदन नं. छान्नुहोस्', 'error');
                document.getElementById('Application_No').focus(); 
                return; 
            }

            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> पठाउँदै...';

            // Get the Application_No from the selected ID
            const selectedLetter = lettersData.find(row => String(row.ID) === String(appId));
            const appNo = selectedLetter ? selectedLetter.Application_No : '';

            // Create FormData and manually set all values to ensure they are sent
            const formData = new FormData(form);
            
            // Replace the ID with actual Application_No
            formData.set('Application_No', appNo);
            
            // Make sure Previous_Repair_Cost is included (it's in the form already)
            // But let's double check and set it explicitly
            const prevCost = document.getElementById('Previous_Repair_Cost').value;
            if (prevCost) {
                formData.set('Previous_Repair_Cost', prevCost);
            }

            // If editing, send the ID for update
            if (isEditing && editingId) {
                formData.append('_method', 'PUT');
                formData.append('ID', editingId);
            }

            // Debug: Log all data being sent
            console.log('=== SUBMITTING DATA ===');
            for (let [key, value] of formData.entries()) {
                console.log(key + ':', value);
            }

            fetch(SCRIPT_URL, { method: 'POST', body: formData })
                .then(r => r.json())
                .then(d => {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-save"></i> सुरक्षित';
                    
                    if (d.result === 'success') {
                        showToast(isEditing ? '✅ रेकर्ड अद्यावधिक गरियो!' : '✅ डेटा सुरक्षित गरियो!', 'success');
                        form.reset();
                        document.getElementById('Fiscal_Year').value = '२०८१/८२';
                        document.getElementById('Status').value = 'पेन्डिङ';
                        isEditing = false;
                        editingId = null;
                        loadAllData();
                    } else {
                        showToast('❌ ' + (d.error || 'अज्ञात त्रुटि'), 'error');
                    }
                })
                .catch(err => {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-save"></i> सुरक्षित';
                    showToast('⚠️ सर्भर समस्या', 'error');
                    console.error(err);
                });
        });

        // ============================================================
        // RESET
        // ============================================================
        document.getElementById('resetBtn').addEventListener('click', function() {
            if (confirm('फारम खाली गर्ने?')) {
                form.reset();
                document.getElementById('Fiscal_Year').value = '२०८१/८२';
                document.getElementById('Status').value = 'पेन्डिङ';
                clearAllFields();
                isEditing = false;
                editingId = null;
                showToast('फारम खाली गरियो', 'info');
            }
        });

        // ============================================================
        // INIT
        // ============================================================
        loadAllData();

        window.addEventListener('load', function() {
            const now = new Date();
            const year = now.getFullYear() + 57;
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const el = document.getElementById('Entry_Date');
            if (!el.value) el.value = year + '-' + month + '-' + day;
        });
    </script>
</body>
</html>
