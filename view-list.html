<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मर्मत सूची</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Nirmala UI', sans-serif;
        }

        body {
            background: #f0f4f8;
            padding: 1.5rem;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            max-width: 1300px;
            width: 100%;
            background: #fff;
            border-radius: 28px;
            box-shadow: 0 20px 40px -10px rgba(0, 20, 30, 0.2);
            padding: 2rem 2.2rem;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            border-bottom: 3px solid #d0e2f0;
            padding-bottom: 0.8rem;
            margin-bottom: 1.5rem;
        }

        .top-bar h1 {
            font-size: 1.6rem;
            color: #0b2b3d;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .top-bar h1 i {
            color: #1a6f8f;
        }

        .back-btn {
            text-decoration: none;
            background: #e3ecf3;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            color: #1f4960;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .back-btn:hover {
            background: #d0dce6;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
            background: #f8fafc;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            align-items: center;
        }

        .filters input,
        .filters select {
            padding: 0.5rem 0.9rem;
            border: 1px solid #dbe4eb;
            border-radius: 10px;
            font-size: 0.9rem;
            background: #fff;
            outline: none;
            flex: 1;
            min-width: 140px;
        }

        .filters input:focus,
        .filters select:focus {
            border-color: #2b7fa0;
            box-shadow: 0 0 0 3px rgba(35, 120, 160, 0.15);
        }

        .filters .btn-sm {
            padding: 0.5rem 1.2rem;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            background: #1b6a89;
            color: #fff;
            transition: 0.2s;
        }

        .filters .btn-sm:hover {
            background: #0f5773;
        }

        .filters .btn-sm.outline {
            background: transparent;
            border: 1px solid #b2ccdb;
            color: #1f4960;
        }

        .filters .btn-sm.outline:hover {
            background: #e2edf5;
        }

        .table-wrap {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #e8f0f5;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            min-width: 900px;
        }

        th {
            background: #eef5fa;
            color: #1e4057;
            padding: 0.7rem 0.8rem;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #d0e2f0;
            white-space: nowrap;
        }

        td {
            padding: 0.6rem 0.8rem;
            border-bottom: 1px solid #e8f0f5;
            vertical-align: middle;
        }

        tr:hover {
            background: #f8fafc;
        }

        .status-badge {
            padding: 0.2rem 0.7rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }
        .status-approved {
            background: #d4edda;
            color: #155724;
        }
        .status-rejected {
            background: #f8d7da;
            color: #721c24;
        }
        .status-completed {
            background: #cce5ff;
            color: #004085;
        }
        .status-quotation {
            background: #e8d5b7;
            color: #6b4f2e;
        }
        .status-paid {
            background: #d1e7dd;
            color: #0f5132;
        }

        .action-btns {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .action-btns button {
            border: none;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
        }

        .action-btns .edit {
            background: #d9e9f2;
            color: #004466;
        }
        .action-btns .edit:hover {
            background: #b5d4e3;
        }
        .action-btns .print {
            background: #d4edda;
            color: #155724;
        }
        .action-btns .print:hover {
            background: #b7dfc6;
        }

        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-top: 1.2rem;
        }

        .pagination button {
            padding: 0.4rem 1rem;
            border: 1px solid #dbe4eb;
            border-radius: 8px;
            background: #fff;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 500;
        }

        .pagination button:hover {
            background: #eef5fa;
        }

        .pagination button.active {
            background: #1b6a89;
            color: #fff;
            border-color: #1b6a89;
        }

        .pagination .info {
            color: #5d7f92;
            font-size: 0.85rem;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #fff;
            border-radius: 20px;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal h2 {
            margin-bottom: 1.2rem;
            color: #0b2b3d;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal .form-group {
            margin-bottom: 0.8rem;
        }

        .modal .form-group label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #1e4057;
            display: block;
            margin-bottom: 0.2rem;
        }

        .modal .form-group input,
        .modal .form-group select,
        .modal .form-group textarea {
            width: 100%;
            padding: 0.5rem 0.8rem;
            border: 1px solid #dbe4eb;
            border-radius: 10px;
            font-size: 0.9rem;
            outline: none;
        }

        .modal .form-group input:focus,
        .modal .form-group select:focus,
        .modal .form-group textarea:focus {
            border-color: #2b7fa0;
            box-shadow: 0 0 0 3px rgba(35, 120, 160, 0.15);
        }

        .modal .form-group input[readonly] {
            background: #eef4f9;
            color: #1f4a61;
            cursor: not-allowed;
        }

        .modal .form-group textarea[readonly] {
            background: #eef4f9;
            color: #1f4a61;
            cursor: not-allowed;
        }

        .modal .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.8rem;
            margin-top: 1.2rem;
            padding-top: 1rem;
            border-top: 1px solid #e8f0f5;
        }

        .modal .modal-actions button {
            padding: 0.5rem 1.5rem;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .modal .modal-actions .save-btn {
            background: #1b6a89;
            color: #fff;
        }
        .modal .modal-actions .save-btn:hover {
            background: #0f5773;
        }
        .modal .modal-actions .cancel-btn {
            background: #e3ecf3;
            color: #1f4960;
        }
        .modal .modal-actions .cancel-btn:hover {
            background: #d0dce6;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: #0d3144;
            color: #fff;
            padding: 0.7rem 2rem;
            border-radius: 60px;
            font-weight: 500;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
            z-index: 999;
            opacity: 0;
            transition: 0.25s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }
        .toast.success {
            background: #1b7a56;
        }
        .toast.error {
            background: #a13d3d;
        }

        @media (max-width: 640px) {
            .container {
                padding: 1rem;
            }
            .filters {
                flex-direction: column;
                align-items: stretch;
            }
            .filters input,
            .filters select {
                min-width: auto;
            }
            .top-bar {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <h1><i class="fas fa-list"></i> मर्मत सूची</h1>
        </div>

        <div class="filters">
            <input type="text" id="searchInput" placeholder="🔍 खोज्नुहोस्...">
            <input type="date" id="filterDate" title="मिति फिल्टर">
            <input type="text" id="filterFirm" placeholder="🏢 फर्म">
            <input type="text" id="filterVehicle" placeholder="🚛 सवारी नं.">
            <button class="btn-sm" id="filterBtn"><i class="fas fa-filter"></i> फिल्टर</button>
            <button class="btn-sm outline" id="clearFilterBtn"><i class="fas fa-times"></i> खाली</button>
            <button class="btn-sm" id="refreshBtn"><i class="fas fa-sync"></i> रिफ्रेस</button>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>क्र.सं.</th>
                        <th>निवेदन नं.</th>
                        <th>मिति</th>
                        <th>सवारी नं.</th>
                        <th>सामान</th>
                        <th>अनुमानित लागत</th>
                        <th>फर्म</th>
                        <th>स्थिति</th>
                        <th style="text-align:center;">कार्य</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="9" style="text-align:center;padding:2rem;color:#5d7f92;">
                            <i class="fas fa-spinner fa-pulse"></i> डाटा लोड हुँदै...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="pagination">
            <div class="info" id="paginationInfo">कुल ० रेकर्ड</div>
            <div>
                <button id="prevPage"><i class="fas fa-chevron-left"></i> अघिल्लो</button>
                <span id="pageInfo" style="margin:0 0.8rem;font-weight:500;">पृष्ठ १</span>
                <button id="nextPage">अर्को <i class="fas fa-chevron-right"></i></button>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <h2><i class="fas fa-edit"></i> सम्पादन गर्नुहोस्</h2>
            <form id="editForm">
                <input type="hidden" id="editId" name="ID">
                <div class="form-group">
                    <label>निवेदन नं.</label>
                    <input type="text" id="editAppNo" name="Application_No" readonly style="background:#eef4f9;">
                </div>
                <div class="form-group">
                    <label>दर्ता मिति</label>
                    <input type="text" id="editEntryDate" name="Entry_Date" readonly>
                </div>
                <div class="form-group">
                    <label>सवारी नं.</label>
                    <input type="text" id="editVehicleNo" name="Vehicle_No" readonly>
                </div>
                <div class="form-group">
                    <label>अनुमानित लागत</label>
                    <input type="number" id="editCost" name="Estimated_Repair_Cost" step="0.01">
                </div>
                <div class="form-group">
                    <label>मर्मत गर्ने फर्म</label>
                    <input type="text" id="editFirm" name="Workshop_Firm" readonly>
                </div>
                <div class="form-group">
                    <label>स्थिति</label>
                    <select id="editStatus" name="Status">
                        <option value="पेन्डिङ">पेन्डिङ</option>
                        <option value="स्वीकृत">स्वीकृत</option>
                        <option value="अस्वीकृत">अस्वीकृत</option>
                        <option value="सम्पन्न">सम्पन्न</option>
                        <option value="कोटेशन पेश गरेको">कोटेशन पेश गरेको</option>
                        <option value="भुक्तानी भएको">भुक्तानी भएको</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>मर्मत कारण</label>
                    <textarea id="editReason" name="Repair_Reason" rows="2" readonly></textarea>
                </div>
                <div class="form-group">
                    <label>कैफियत</label>
                    <textarea id="editRemarks" name="Remarks" rows="2" readonly></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="cancel-btn" id="closeModalBtn">रद्द</button>
                    <button type="submit" class="save-btn"><i class="fas fa-save"></i> सुरक्षित</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxlPhy_16N--T89myiSGwWlwXeC8Qrh8-5xRf6z7Gua8ATFtPMUpqlmHj7jCkKhi_6A/exec";
        let allData = [];
        let filteredData = [];
        let currentPage = 1;
        const perPage = 20;
        let editingId = null;

        const toast = document.getElementById('toast');

        function showToast(msg, type = 'success') {
            toast.textContent = msg;
            toast.className = 'toast show ' + type;
            clearTimeout(toast._hideTimer);
            toast._hideTimer = setTimeout(() => { toast.classList.remove('show'); }, 3500);
        }

        function getStatusClass(status) {
            const map = {
                'पेन्डिङ': 'status-pending',
                'स्वीकृत': 'status-approved',
                'अस्वीकृत': 'status-rejected',
                'सम्पन्न': 'status-completed',
                'कोटेशन पेश गरेको': 'status-quotation',
                'भुक्तानी भएको': 'status-paid'
            };
            return map[status] || 'status-pending';
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const start = (currentPage - 1) * perPage;
            const end = start + perPage;
            const pageData = filteredData.slice(start, end);

            if (pageData.length === 0) {
                tbody.innerHTML =
                    `<tr><td colspan="9" style="text-align:center;padding:2rem;color:#5d7f92;">कुनै रेकर्ड छैन</td></tr>`;
                document.getElementById('paginationInfo').textContent = `कुल ० रेकर्ड`;
                document.getElementById('pageInfo').textContent = `पृष्ठ १`;
                return;
            }

            let html = '';
            pageData.forEach((row, idx) => {
                const sn = start + idx + 1;
                const status = row.Status || 'पेन्डिङ';
                html += `
                    <tr>
                        <td>${sn}</td>
                        <td><strong>${row.Application_No || '-'}</strong></td>
                        <td>${row.Entry_Date || row.Date || '-'}</td>
                        <td>${row.Vehicle_No || '-'}</td>
                        <td>${row.Item_Name || row.Item_Identification_No || '-'}</td>
                        <td>${row.Estimated_Repair_Cost ? 'रु. ' + row.Estimated_Repair_Cost : '-'}</td>
                        <td>${row.Workshop_Firm || '-'}</td>
                        <td><span class="status-badge ${getStatusClass(status)}">${status}</span></td>
                        <td>
                            <div class="action-btns">
                                <button class="edit" onclick="editRecord('${row.ID || row.Application_No}')"><i class="fas fa-edit"></i></button>
                                <button class="print" onclick="printRecord('${row.Application_No}')"><i class="fas fa-print"></i></button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
            const total = filteredData.length;
            const totalPages = Math.ceil(total / perPage);
            document.getElementById('paginationInfo').textContent = `कुल ${total} रेकर्ड · पृष्ठ ${currentPage}/${totalPages || 1}`;
            document.getElementById('pageInfo').textContent = `पृष्ठ ${currentPage}`;
        }

        function loadData() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;padding:2rem;color:#5d7f92;">
                <i class="fas fa-spinner fa-pulse"></i> डाटा लोड हुँदै...</td></tr>`;

            fetch(`${SCRIPT_URL}?action=repairs`)
                .then(r => r.json())
                .then(data => {
                    allData = Array.isArray(data) ? data : [];
                    applyFilters();
                })
                .catch(err => {
                    console.error('Load error:', err);
                    tbody.innerHTML =
                        `<tr><td colspan="9" style="text-align:center;padding:2rem;color:#a13d3d;">
                        <i class="fas fa-exclamation-circle"></i> डाटा लोड गर्न असफल</td></tr>`;
                    showToast('⚠️ डाटा लोड गर्न समस्या', 'error');
                });
        }

        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const date = document.getElementById('filterDate').value;
            const firm = document.getElementById('filterFirm').value.toLowerCase();
            const vehicle = document.getElementById('filterVehicle').value.toLowerCase();

            filteredData = allData.filter(row => {
                const matchSearch = !search ||
                    Object.values(row).some(v => String(v).toLowerCase().includes(search));
                const matchDate = !date || row.Entry_Date === date || row.Date === date;
                const matchFirm = !firm || String(row.Workshop_Firm).toLowerCase().includes(firm);
                const matchVehicle = !vehicle || String(row.Vehicle_No).toLowerCase().includes(vehicle);
                return matchSearch && matchDate && matchFirm && matchVehicle;
            });

            currentPage = 1;
            renderTable();
        }

        // Edit Record
        function editRecord(id) {
            const row = allData.find(r => r.ID == id || r.Application_No == id);
            if (!row) { showToast('रेकर्ड फेला परेन', 'error'); return; }

            editingId = row.ID || row.Application_No;
            document.getElementById('editId').value = editingId;
            document.getElementById('editAppNo').value = row.Application_No || '';
            document.getElementById('editEntryDate').value = row.Entry_Date || '';
            document.getElementById('editVehicleNo').value = row.Vehicle_No || '';
            document.getElementById('editCost').value = row.Estimated_Repair_Cost || '';
            document.getElementById('editFirm').value = row.Workshop_Firm || '';
            document.getElementById('editStatus').value = row.Status || 'पेन्डिङ';
            document.getElementById('editReason').value = row.Repair_Reason || '';
            document.getElementById('editRemarks').value = row.Remarks || '';

            document.getElementById('editModal').classList.add('active');
        }

        // Save Edit
        document.getElementById('editForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const fd = new FormData(this);
            fd.append('sheetName', 'Repairs');
            fd.append('_method', 'PUT');

            fetch(SCRIPT_URL, { method: 'POST', body: fd })
                .then(r => r.json())
                .then(d => {
                    if (d.result === 'success') {
                        showToast('✅ रेकर्ड अद्यावधिक गरियो', 'success');
                        document.getElementById('editModal').classList.remove('active');
                        loadData();
                    } else {
                        showToast('❌ ' + (d.error || 'अद्यावधिक गर्न असफल'), 'error');
                    }
                })
                .catch(err => {
                    showToast('⚠️ सर्भर समस्या', 'error');
                    console.error(err);
                });
        });

        // Print Record
        function printRecord(appNo) {
            if (!appNo) { showToast('निवेदन नं. छैन', 'error'); return; }
            window.open(`print.html?appNo=${appNo}`, '_blank');
        }

        // Close Modal
        document.getElementById('closeModalBtn').addEventListener('click', function() {
            document.getElementById('editModal').classList.remove('active');
        });
        document.getElementById('editModal').addEventListener('click', function(e) {
            if (e.target === this) this.classList.remove('active');
        });

        // Filter Events
        document.getElementById('filterBtn').addEventListener('click', applyFilters);
        document.getElementById('clearFilterBtn').addEventListener('click', function() {
            document.getElementById('searchInput').value = '';
            document.getElementById('filterDate').value = '';
            document.getElementById('filterFirm').value = '';
            document.getElementById('filterVehicle').value = '';
            applyFilters();
        });
        document.getElementById('refreshBtn').addEventListener('click', loadData);

        // Pagination
        document.getElementById('prevPage').addEventListener('click', function() {
            if (currentPage > 1) { currentPage--;
                renderTable(); }
        });
        document.getElementById('nextPage').addEventListener('click', function() {
            const totalPages = Math.ceil(filteredData.length / perPage);
            if (currentPage < totalPages) { currentPage++;
                renderTable(); }
        });

        // Search on Enter
        document.getElementById('searchInput').addEventListener('keyup', function(e) {
            if (e.key === 'Enter') applyFilters();
        });

        // Init
        loadData();
    </script>
</body>
</html>
